  // ================================================================ 联机
  //
  // 联机是可选的：不开房间时一切照旧（复制链接、私信文本都保留）。开了房间之后：
  //   - 公开信息（和公开展示页同样的内容）每次保存后自动推给所有玩家页；
  //   - 玩家页发来的行动、守夜卡、投票、领取补给、交公由本页按规则记账（记日志；不进撤销栈，撤销别的操作时也不会被撤掉）；
  //   - 私信、发放的物品、撤回直接送到对应玩家的页面，对方离线时房间先存着，上线再收。
  // 同一浏览器只让一个标签页联机；另一个标签页或设备顶替后，本页不再处理联机消息。

  var NET_KEY = 'shelter-playtest:host:net:';
  var NET_LOCK = 'shelter-playtest:host:netlock';
  var net = { cfg: null, link: null, lock: null, status: 'idle', info: null, online: [], guests: [], bindings: [], snapKey: '', pubTimer: null, feed: [], offers: {}, server: '', pendingBusy: false, seq: 0, journal: [] };

  function netCfgKey() {
    return NET_KEY + slot;
  }

  function netBound(pid) {
    return net.bindings.some(function (b) { return b.pid === pid; });
  }

  function netReach(pid) {
    return !!net.link && netBound(pid);
  }

  function netIsOnline(pid) {
    return net.online.indexOf(pid) >= 0;
  }

  function netFeed(text) {
    net.feed.unshift({ at: Date.now(), text: text });
    if (net.feed.length > 80) net.feed.length = 80;
  }

  function netSend(to, m) {
    return net.link ? net.link.post({ t: 'send', to: to, m: m }) : null;
  }

  /**
   * 联机带来的修改（玩家页发来的、已经发出去的）：不进撤销栈，记进联机日志；
   * 撤销主持人自己的操作时，这些修改会重新套用，不会被一起撤掉。fn 要只改 s、不发消息，校验不过就抛错。
   */
  function netCommit(label, fn) {
    var ok = commit(label, fn, { undo: false });
    if (ok) {
      net.seq += 1;
      net.journal.push({ seq: net.seq, label: label, fn: fn });
      if (net.journal.length > 400) net.journal.shift();
    }
    return ok;
  }

  // ---------------------------------------------------------------- 补给：发到玩家页、撤回

  function grantKey(b, piece) {
    return 'g-' + b.id + '-' + piece.id;
  }

  /** 这件补给是不是已经通过房间发到玩家页（撤回时玩家页会自动扣回）。 */
  function netGranted(key) {
    return !!(net.cfg && net.cfg.grants && net.cfg.grants[key]);
  }

  function heldPicks(s) {
    var out = {};
    (s.batches || []).forEach(function (b) {
      if (b.status === 'undone') return;
      b.picks.forEach(function (p) { out[grantKey(b, p.piece)] = { b: b, pick: p }; });
    });
    return out;
  }

  /**
   * 每次改动后对比前后的领取记录：新领到的（玩家已加入房间）发到玩家页、自动入库；
   * 发出去以后又不算数的（撤回、整批撤销、撤销操作）通知玩家页扣回。领取、撤回、撤销都走这一处。
   */
  function netReconcile(prev, next) {
    if (!net.cfg || !net.link) return;
    var grants = net.cfg.grants || (net.cfg.grants = {});
    var before = heldPicks(prev);
    var after = heldPicks(next);
    var dirty = false;
    Object.keys(grants).forEach(function (key) {
      var g = grants[key];
      if (after[key] && after[key].pick.playerId === g.pid) return;
      netSend(g.pid, { kind: 'revoke', grantId: key, items: g.items, reason: '主持人撤回了「' + g.label + '」里领到的这件' });
      delete grants[key];
      dirty = true;
    });
    Object.keys(after).forEach(function (key) {
      var x = after[key];
      var pid = x.pick.playerId;
      if (grants[key] || (before[key] && before[key].pick.playerId === pid) || !netBound(pid)) return;
      var items = [C.packItem(x.pick.piece, 1, next.customItems)];
      var label = x.b.label + '（' + (x.b.day ? '第' + x.b.day + '天' : '开局') + '）';
      netSend(pid, { kind: 'grant', grantId: key, batchId: x.b.id, items: items, reason: label });
      grants[key] = { pid: pid, items: items, label: label, at: Date.now() };
      dirty = true;
    });
    if (dirty) ShelterNet.writeJSON(netCfgKey(), net.cfg);
  }

  /**
   * 整份存档被换掉（导入、重置，或撤销它们）：领取记录和已经发出去的物品对不上了，
   * 不自动发放或扣回（不知道玩家手上实际有什么），从这里重新开始记。
   */
  function netRebase() {
    if (!net.cfg || !net.cfg.grants || !Object.keys(net.cfg.grants).length) return;
    net.cfg.grants = {};
    ShelterNet.writeJSON(netCfgKey(), net.cfg);
  }

  function netBoot() {
    net.lock = new ShelterNet.TabLock(NET_LOCK + ':' + slot);
    net.cfg = ShelterNet.readJSON(netCfgKey(), null);
    if (net.cfg && net.cfg.code) {
      if (net.lock.mine()) netStart();
      else net.status = 'elsewhere';
    }
  }

  /** 切换正式／演示存档：房间跟着存档走。 */
  function netSwitchSlot() {
    if (net.link) net.link.stop();
    net.link = null;
    net.status = 'idle';
    net.bindings = [];
    net.online = [];
    net.guests = [];
    net.journal = [];
    net.offers = {};
    if (net.lock) net.lock.release();
    netBoot();
  }

  function netStart() {
    if (net.link) net.link.stop();
    var cfg = net.cfg;
    net.lock.take();
    net.snapKey = '';
    net.offers = {};
    net.link = new ShelterNet.Link({
      base: cfg.base, code: cfg.code, store: 'shelter-playtest:host:netq:' + cfg.code,
      hello: function () { return { role: 'host', key: cfg.hostKey }; },
      onMessage: netReceive,
      on: netEvent
    });
    net.link.start();
  }

  /** 断开：本页不再联机，房间还在（之后可以重新连上）。 */
  function netDisconnect() {
    if (net.link) net.link.stop();
    net.link = null;
    net.status = 'idle';
    if (net.lock) net.lock.release();
    render();
  }

  function netCreate() {
    var base = ShelterNet.serverBase(net.server);
    ui.netBusy = true;
    render();
    ShelterNet.createRoom(base).then(function (r) {
      ui.netBusy = false;
      net.cfg = { base: base, code: r.code, hostKey: r.hostKey, auto: true, createdAt: Date.now() };
      ShelterNet.writeJSON(netCfgKey(), net.cfg);
      netStart();
      netFeed('房间已开好：' + r.code);
      U.toast('房间已开好：' + r.code, 'ok');
      render();
    }, function (err) {
      ui.netBusy = false;
      render();
      U.modal({
        title: '连不上联机服务器',
        body: h('div', { class: 'stack' },
          h('p', null, '服务器：' + base + '（' + (err && err.message ? err.message : '网络错误') + '）'),
          ShelterNet.lan()
            ? h('p', null, '局域网服务器好像没有在运行：请确认主持人电脑上的 shelter-lan 窗口还开着。')
            : h('p', null, '云端服务器还没部署，或者当前网络连不上它。也可以用局域网版：在入口页下载 shelter-lan.mjs，在主持人电脑上运行。'))
      });
    });
  }

  function netEnd() {
    U.confirmBox('关闭房间？', '所有玩家会断开，房间里暂存的消息一并删除。游戏存档不受影响，之后可以再开新房间。', '关闭房间', 'danger').then(function (ok) {
      if (!ok) return;
      if (net.link) {
        net.link.raw({ t: 'end' });
        net.link.forget();
        net.link.stop();
      }
      netForget();
      U.toast('房间已关闭', 'ok');
    });
  }

  function netForget() {
    net.link = null;
    net.cfg = null;
    net.status = 'idle';
    net.bindings = [];
    net.online = [];
    net.guests = [];
    ShelterNet.removeKey(netCfgKey());
    if (net.lock) net.lock.release();
    render();
  }

  /** 收到网络事件时重画；正在输入时先只画顶栏，离开输入框后再画主体（不打断打字）。 */
  function netQuietRender() {
    ui.quietRender = true;
    try { render(); } finally { ui.quietRender = false; }
  }

  function netEvent(type, d) {
    if (type === 'status') {
      net.status = d.status;
      net.info = d.info;
      if (d.status === 'stopped') netStopped(d.info);
      else netQuietRender();
      return;
    }
    if (type === 'welcome') {
      net.bindings = d.players || [];
      net.online = d.online || [];
      net.guests = d.guests || [];
      netPublish(true);
      netSyncOffers(true);
      netQuietRender();
      return;
    }
    if (type === 'presence') {
      net.online = d.online || [];
      net.guests = d.guests || [];
      netPublish(false);
      netQuietRender();
      return;
    }
    if (type === 'join') { netJoin(d); return; }
    if (type === 'bound') {
      // 新加入或换了设备（boundAt 变了）：发规则包
      var before = {};
      net.bindings.forEach(function (b) { before[b.pid] = b.boundAt; });
      net.bindings = d.players || [];
      net.bindings.forEach(function (b) { if (before[b.pid] !== b.boundAt) netWelcome(b.pid); });
      netPublish(false);
      netSyncOffers(true);
      netQuietRender();
      return;
    }
    if (type === 'error') U.toast(d.message || d.code, 'warn');
  }

  function netStopped(code) {
    var text = {
      replaced: '联机已转到另一个标签页或设备：本页不再处理联机消息。',
      'bad-key': '这个房间的主持人密钥不对，已经离开房间。',
      'no-room': '房间不存在或已经过期，已经离开房间。',
      ended: '房间已经关闭。',
      version: '页面版本和联机服务器不一致：请刷新页面。'
    }[code] || ('联机已停止（' + code + '）');
    if (code === 'no-room' || code === 'ended' || code === 'bad-key') {
      if (net.link) net.link.forget();
      netForget();
    } else if (code === 'replaced') {
      net.link = null;
      net.status = 'elsewhere';
    }
    U.toast(text, 'warn');
    render();
  }

  // ---------------------------------------------------------------- 加入

  function netJoin(d) {
    var p = d.pid ? playerById(d.pid) : null;
    var who = d.name || (p && p.name) || '有人';
    if (net.cfg && net.cfg.auto && p && !netBound(p.id)) {
      net.link.raw({ t: 'approve', gid: d.gid, pid: p.id });
      netFeed(p.name + ' 加入了房间');
      U.toast(p.name + ' 加入了房间', 'ok');
      return;
    }
    netFeed(who + ' 请求加入，等你通过');
    U.toast(who + ' 请求加入：到「联机」页通过', 'info');
    netQuietRender();
  }

  function netApprove(gid, pid) {
    if (net.link && net.link.raw({ t: 'approve', gid: gid, pid: pid })) netFeed(nameOf(pid) + ' 加入了房间');
  }

  function netReject(gid) {
    if (net.link) net.link.raw({ t: 'reject', gid: gid, reason: '主持人没有通过' });
  }

  function netKick(pid) {
    U.confirmBox('移出 ' + nameOf(pid) + '？', '这台设备会断开，加入凭证作废；以后可以重新加入（例如换手机时）。', '移出', 'danger').then(function (ok) {
      if (!ok || !net.link) return;
      net.link.raw({ t: 'kick', pid: pid });
      netFeed('移出 ' + nameOf(pid));
    });
  }

  /** 新加入的玩家：发规则包（规则、自定义物品、玩家名单），玩家页自动导入。 */
  function netWelcome(pid) {
    netSend(pid, { kind: 'rules', pack: C.makeRulesPack(state, null) });
  }

  function netResendRules() {
    net.bindings.forEach(function (b) { netWelcome(b.pid); });
    U.toast('规则包已排队发给 ' + net.bindings.length + ' 位玩家', 'ok');
  }

  // ---------------------------------------------------------------- 公开信息、补给邀请、自动记录行动（每次保存后）

  function netAfterSave() {
    if (!net.link) return;
    netPublish(false);
    netSyncOffers(false);
    netPendingActions();
  }

  function netPublish(force) {
    if (!net.link || net.status !== 'online') return;
    clearTimeout(net.pubTimer);
    net.pubTimer = setTimeout(function () {
      if (!net.link) return;
      var snap = C.publicSnapshot(state, Date.now());
      snap.joined = net.bindings.map(function (b) { return b.pid; });
      snap.online = net.online.slice();
      var tm = state.timer;
      var key = JSON.stringify(Object.assign({}, snap, { at: 0, timer: { running: tm.running, endsAt: tm.endsAt, remainingMs: tm.running ? 0 : tm.remainingMs, durationMs: tm.durationMs } }));
      if (!force && key === net.snapKey) return;
      if (net.link.raw({ t: 'pub', s: snap })) net.snapKey = key;
    }, force ? 0 : 200);
  }

  function nextPicker(b) {
    return b.pickOrder.filter(function (id) { return !b.picks.some(function (p) { return p.playerId === id; }); })[0] || null;
  }

  /** 补给批次：轮到谁领，就把候选清单发到谁的页面；批次结束或换人时收回。 */
  function netSyncOffers(force) {
    if (!net.link) return;
    var live = {};
    state.batches.filter(function (b) { return b.status === 'open'; }).forEach(function (b) {
      var next = nextPicker(b);
      if (!next || !netBound(next)) return;
      var key = b.id + ':' + next + ':' + b.items.map(function (p) { return p.id; }).join(',');
      live[b.id] = key;
      var prev = net.offers[b.id];
      if (!force && prev === key) return;
      if (prev && prev.split(':')[1] !== next) netSend(prev.split(':')[1], { kind: 'offer-cancel', batchId: b.id });
      net.offers[b.id] = key;
      netSend(next, {
        kind: 'offer', batchId: b.id, label: b.label, dayText: b.day ? '第' + b.day + '天' : '开局',
        items: b.items.map(function (p) { return { id: p.id, name: describe(p) }; })
      });
    });
    Object.keys(net.offers).forEach(function (bid) {
      if (live[bid]) return;
      netSend(net.offers[bid].split(':')[1], { kind: 'offer-cancel', batchId: bid });
      delete net.offers[bid];
    });
  }

  /** 轮到谁、谁在玩家页已经选好行动：自动记录（下一个人也选好了就接着记）。 */
  function netPendingActions() {
    var t = state.today;
    if (net.pendingBusy || state.phase !== 'actions' || !t.actionOrder || !t.netPending) return;
    var cur = C.nextActor(t.actionOrder, t.actedIds);
    if (!cur || !t.netPending[cur]) return;
    net.pendingBusy = true;
    setTimeout(function () {
      net.pendingBusy = false;
      var t2 = state.today;
      if (state.phase !== 'actions' || !t2.actionOrder || !t2.netPending || !t2.netPending[cur] || C.nextActor(t2.actionOrder, t2.actedIds) !== cur) return;
      var type = t2.netPending[cur].type;
      ui.quietRender = true;
      var ok;
      try {
        ok = netCommit('记录行动（玩家页）', function (s) {
          var tt = s.today;
          if (s.phase !== 'actions' || !tt.actionOrder || !tt.netPending || !tt.netPending[cur] || C.nextActor(tt.actionOrder, tt.actedIds) !== cur) throw new Error('还没轮到 ' + nameOf(cur));
          var p = tt.netPending[cur];
          var r = C.recordAction(s, cur, { type: p.type, note: p.note });
          if (!r.ok) throw new Error(r.reason);
          r.action.via = 'net';
          delete tt.netPending[cur];
          log(s, nameOf(cur) + '：' + actionText({ type: p.type }) + '（玩家页）');
          if (p.note) log(s, nameOf(cur) + ' 行动备注：' + p.note, true);
        });
      } finally {
        ui.quietRender = false;
      }
      if (ok) U.toast(nameOf(cur) + '：' + actionText({ type: type }), 'ok');
    }, 0);
  }

  // ---------------------------------------------------------------- 玩家页发来的

  function netReceive(e) {
    var m = e.m || {};
    ui.quietRender = true;
    try {
      if (e.cc) return netCopy(e);
      var pid = e.from;
      if (!playerById(pid)) { netFeed('收到不在名单里的玩家发来的消息，已忽略'); return true; }
      switch (m.kind) {
        case 'action': return netAction(pid, m);
        case 'action-cancel': return netActionCancel(pid);
        case 'watch': return netWatch(pid, m);
        case 'vote': return netVote(pid, m);
        case 'supply-pick': return netSupplyPick(pid, m);
        case 'deposit': return netDeposit(pid, m);
        case 'note': return netNote(pid, m);
        default:
          netFeed(nameOf(pid) + ' 发来看不懂的消息（' + m.kind + '）：可能需要刷新页面');
          return true;
      }
    } finally {
      ui.quietRender = false;
    }
  }

  /** 玩家之间的赠予、治疗：房间给主持人留的副本，只记日志。 */
  function netCopy(e) {
    var m = e.m || {};
    var desc = m.kind === 'gift' ? '赠予 ' + nameOf(e.cc) + '：' + C.describeItems(m.items, state.customItems)
      : m.kind === 'heal' ? '治疗 ' + nameOf(e.cc) + '：' + (m.text || '') : String(m.kind || '');
    var line = nameOf(e.from) + ' ' + desc;
    netFeed(line);
    netCommit('联机记录', function (s) { log(s, line + '（玩家之间）', true); });
    return true;
  }

  function netAction(pid, m) {
    var label = actionText({ type: m.type });
    if (['plan', 'skill', 'other', 'pass', 'swap'].indexOf(m.type) < 0) return true;
    if (!state.started || m.day !== state.day) {
      netFeed(nameOf(pid) + ' 上报的「' + label + '」不是今天的行动，没有记录');
      netSend(pid, { kind: 'text', text: '主持人页没有记录你的行动：' + (state.started ? '你的页面天数和主持人不一致，请等页面同步后再选。' : '游戏还没开始。') });
      return true;
    }
    if (m.type === 'swap') {
      netFeed(nameOf(pid) + ' 想尝试换位：请在主持台用「换位请求」记录');
      U.toast(nameOf(pid) + ' 想尝试换位：请用「换位请求」记录', 'info');
      netSend(pid, { kind: 'text', text: '换位要双方同意：轮到你时告诉主持人想和谁换，由主持人记录结果。' });
      return true;
    }
    if (state.today.actedIds.indexOf(pid) >= 0) {
      netFeed(nameOf(pid) + ' 在玩家页改成了「' + label + '」：本轮已有记录，要改请先撤销');
      U.toast(nameOf(pid) + ' 改了行动：本轮已有记录，要改请先撤销', 'warn');
      netSend(pid, { kind: 'text', text: '你今天的行动已经记录，改成「' + label + '」没有生效：要改请直接找主持人。' });
      return true;
    }
    netCommit('玩家页行动', function (s) {
      if (!s.started || s.day !== m.day || s.today.actedIds.indexOf(pid) >= 0) throw new Error('本轮已有记录');
      s.today.netPending = s.today.netPending || {};
      s.today.netPending[pid] = { type: m.type, note: String(m.note || '').slice(0, 200), at: Date.now() };
      log(s, nameOf(pid) + ' 在玩家页选了「' + label + '」', true);
    });
    var t = state.today;
    netFeed(nameOf(pid) + ' 选了「' + label + '」' + (state.phase === 'actions' && t.actionOrder && C.nextActor(t.actionOrder, t.actedIds) === pid ? '' : '（轮到时自动记录）'));
    netPendingActions();
    return true;
  }

  function netActionCancel(pid) {
    var t = state.today;
    if (t.netPending && t.netPending[pid]) {
      netCommit('玩家页取消行动', function (s) {
        if (!s.today.netPending || !s.today.netPending[pid]) return false;
        delete s.today.netPending[pid];
        log(s, nameOf(pid) + ' 在玩家页取消了行动', true);
      });
      netFeed(nameOf(pid) + ' 取消了还没记录的行动');
      return true;
    }
    if (t.actedIds.indexOf(pid) >= 0) {
      netFeed(nameOf(pid) + ' 在玩家页取消了行动：本轮已经记录，需要的话请手动撤销');
      U.toast(nameOf(pid) + ' 取消了行动：本轮已经记录，需要的话请手动撤销', 'warn');
    }
    return true;
  }

  /** 把一张守夜卡加进今天的候选池（链接、玩家页发来的都走这里）。 */
  function addWatchCandidate(s, pid, card, source, how) {
    if (s.today.finalWatch) throw new Error('今日最终名单已确认');
    if (s.today.plannerIds.indexOf(pid) < 0) {
      var rec = C.recordAction(s, pid, { type: 'plan' });
      if (!rec.ok) s.today.plannerIds.push(pid);
      log(s, nameOf(pid) + '：计划守夜名单（' + how + '）');
    }
    if (s.today.netPending) delete s.today.netPending[pid];
    s.today.watchCandidates = s.today.watchCandidates.filter(function (c) { return c.plannerId !== pid; });
    s.today.watchCandidates.push({ id: C.uid('wc'), plannerId: pid, day: s.day, options: [card], chosenIndex: 0, submittedAt: Date.now(), createdAt: Date.now(), source: source });
    s.today.watchDecision = null;
    log(s, nameOf(pid) + ' 发来守夜卡片：' + C.describeWatchOption(card, nameOf), true);
  }

  function netWatch(pid, m) {
    var data = m.data || {};
    var card = data.card;
    if (!card || typeof card !== 'object') return true;
    if (state.today.finalWatch) {
      netSend(pid, { kind: 'text', text: '今天的守夜名单已经确认，你的卡片没有加进候选。' });
      return true;
    }
    var adopted = card.v === 2 ? C.adoptWatchCardV2(card, state.players) : C.adoptWatchCard(card, state.players);
    var ok = netCommit('收到守夜卡片（玩家页）', function (s) { addWatchCandidate(s, pid, adopted.card, 'net', '玩家页发来时补记'); });
    if (ok) {
      netFeed('收到 ' + nameOf(pid) + ' 的守夜卡片' + (data.day !== state.day ? '（注意：这张卡不是今天抽的）' : ''));
      U.toast('收到 ' + nameOf(pid) + ' 的守夜卡片', 'ok');
    }
    return true;
  }

  function netVote(pid, m) {
    var f = state.today.eventFlow;
    if (!f || f.id !== m.flowId || !f.netVote || !f.netVote.open) {
      netSend(pid, { kind: 'text', text: '这次投票已经结束，你的票没有计入。' });
      return true;
    }
    var op = f.event.options.filter(function (o) { return o.id === m.optionId; })[0];
    if (!op) return true;
    if (!isAlive(pid)) {
      netSend(pid, { kind: 'text', text: '已死亡的玩家不能投票。' });
      return true;
    }
    netCommit('投票（玩家页）', function (s) {
      var ff = s.today.eventFlow;
      if (!ff || ff.id !== m.flowId || !ff.netVote || !ff.netVote.open) throw new Error('投票已经结束');
      ff.netVote.ballots[pid] = op.id;
      log(s, '投票：' + nameOf(pid) + ' 选「' + op.label + '」', true);
    });
    netFeed(nameOf(pid) + ' 投了票');
    return true;
  }

  function netSupplyPick(pid, m) {
    var b = state.batches.filter(function (x) { return x.id === m.batchId; })[0];
    var fail = function (reason) {
      netSend(pid, { kind: 'pick-fail', batchId: m.batchId, reason: reason });
      netFeed(nameOf(pid) + ' 领取没成功：' + reason);
    };
    if (!b || b.status !== 'open') { fail('这批补给已经结束'); return true; }
    var next = nextPicker(b);
    if (next !== pid) { fail(next ? '还没轮到你：现在轮到 ' + nameOf(next) : '这批补给已经领完'); return true; }
    var picked = null;
    // 领到的物品在 commit 里（netReconcile）发到玩家页
    var ok = netCommit('领取补给（玩家页）', function (s) {
      var bb = findBatch(s, m.batchId);
      if (!bb || bb.status !== 'open' || nextPicker(bb) !== pid) throw new Error('还没轮到 ' + nameOf(pid) + ' 领取');
      var r = C.pickFromBatch(bb, pid, m.pieceId);
      if (!r.ok) throw new Error(r.reason);
      picked = r.pick;
      log(s, bb.label + '：' + nameOf(pid) + ' 选择 ' + describe(r.pick.piece) + '（玩家页）', true);
      log(s, bb.label + '：' + nameOf(pid) + ' 已领取');
      if (!bb.items.length && bb.picks.length === bb.pickOrder.length) markOpeningDone(s, bb);
    });
    if (!ok || !picked) {
      fail('这件已经被选走或不在候选里：请重新选');
      netSyncOffers(true);
      return true;
    }
    netFeed(nameOf(pid) + ' 领取了 ' + describe(picked.piece));
    return true;
  }

  function netDeposit(pid, m) {
    var items = (m.items || []).filter(function (it) { return it && typeof it.defId === 'string' && C.isInt(it.qty) && it.qty > 0; });
    if (!items.length) return true;
    var what = C.describeItems(items, state.customItems);
    var ok = netCommit('交公（玩家页）', function (s) {
      items.forEach(function (it) {
        if (it.def && C.getDef(it.defId, s.customItems).unknown) {
          var def = C.clone(it.def);
          def.id = it.defId;
          s.customItems.push(def);
        }
        C.addItem(s.pool, it.defId, it.qty, { customItems: s.customItems, rules: s.rules, fields: it.fields, remark: it.remark });
      });
      log(s, nameOf(pid) + ' 交给公共池：' + what + (m.reason ? '（' + String(m.reason).slice(0, 60) + '）' : '') + '（玩家页）', true);
      log(s, '公共池收到交公：' + nameOf(pid));
    });
    if (ok) {
      netFeed(nameOf(pid) + ' 交公：' + what);
      U.toast(nameOf(pid) + ' 交公：' + what, 'ok');
    }
    return true;
  }

  function netNote(pid, m) {
    var text = String(m.text || '').slice(0, 500);
    if (!text) return true;
    netFeed(nameOf(pid) + '：' + text);
    U.toast(nameOf(pid) + '：' + text, 'info');
    netCommit('玩家留言', function (s) { log(s, nameOf(pid) + ' 发来：' + text, true); });
    return true;
  }

  // ---------------------------------------------------------------- 投票（事件结算第 2 步）

  function netVoteControls(flow) {
    if (!net.cfg) return null;
    var nv = flow.netVote;
    if (!flow.published) return h('p', { class: 'muted small' }, '公布事件正文后，可以让玩家直接在自己的页面投票。');
    if (!nv) return h('button', { type: 'button', class: 'btn', onclick: netOpenVote }, '在玩家页面发起投票');
    var tally = C.tallyVotes(flow.event.options, nv.ballots);
    var reach = aliveIds().filter(netBound).length;
    return h('div', { class: 'card inset net-vote' },
      h('div', { class: 'row between' }, h('b', null, nv.open ? '玩家页投票进行中' : '玩家页投票已结束'), chip('已投 ' + tally.total + '／' + aliveIds().length, nv.open ? 'info' : 'ok')),
      nv.open && reach < aliveIds().length ? h('p', { class: 'muted small' }, '在房间里的存活玩家：' + reach + '／' + aliveIds().length + '。他们可以在自己的页面投；其余玩家照常在 Discord 投，由主持人合并后直接录入结果。') : null,
      h('ul', { class: 'list-plain' }, flow.event.options.map(function (o, i) {
        var who = Object.keys(nv.ballots).filter(function (pid) { return nv.ballots[pid] === o.id; });
        return h('li', { 'data-vote-option': o.id }, h('b', null, String.fromCharCode(65 + i) + '. ' + o.label), '：' + tally.counts[o.id] + ' 票',
          who.length ? h('span', { class: 'muted small' }, '（' + names(who) + '）') : null);
      })),
      nv.open
        ? h('div', { class: 'row' }, h('button', { type: 'button', class: 'btn primary', onclick: netCloseVote }, '结束投票并采用结果'))
        : h('div', { class: 'row' },
          tally.top.length !== 1 ? h('span', { class: 'risk-text' }, tally.top.length ? '平票：请主持人裁定（用上面的选择框录入）' : '没有人投票：请主持人裁定') : null,
          h('button', { type: 'button', class: 'btn small', disabled: !!flow.resolutionId, onclick: netReopenVote }, '重新投票')));
  }

  function netOpenVote() {
    commit('发起投票', function (s) {
      var f = s.today.eventFlow;
      f.netVote = { open: true, openedAt: Date.now(), closedAt: null, ballots: {} };
      log(s, '在玩家页发起投票：' + f.event.name);
    });
  }

  function netCloseVote() {
    var top = null;
    commit('结束投票', function (s) {
      var f = s.today.eventFlow;
      f.netVote.open = false;
      f.netVote.closedAt = Date.now();
      var t = C.tallyVotes(f.event.options, f.netVote.ballots);
      log(s, '投票结束：' + f.event.options.map(function (o) { return o.label + ' ' + t.counts[o.id] + ' 票'; }).join('，'));
      if (t.top.length === 1 && !f.resolutionId) {
        top = f.event.options.filter(function (o) { return o.id === t.top[0]; })[0];
        f.vote = top.id;
        f.preview = null;
        f.override = null;
        log(s, '投票结果：' + f.event.name + ' → ' + top.label);
      }
    });
    if (top) U.toast('按多数票录入：' + top.label, 'ok');
    else U.toast('平票或没有人投票：请主持人裁定', 'warn');
  }

  function netReopenVote() {
    commit('重新投票', function (s) {
      var f = s.today.eventFlow;
      f.netVote = { open: true, openedAt: Date.now(), closedAt: null, ballots: {} };
      f.vote = null;
      f.preview = null;
      f.override = null;
      log(s, '重新在玩家页投票：' + f.event.name);
    });
  }

  /** 公开页上的事件是否在玩家页投票（决定显示「玩家页投票」还是「Discord 投票」）。 */
  function netVoteOpen() {
    var f = state.today.eventFlow;
    return !!(f && f.netVote && state.stage.event && state.stage.event.flowId === f.id);
  }

  /** 公开展示页上的投票进度：进行中只显示已投人数，结束后显示票数。 */
  function netVoteStage() {
    var f = state.today.eventFlow;
    if (!netVoteOpen()) return null;
    var tally = C.tallyVotes(f.event.options, f.netVote.ballots);
    if (f.netVote.open) return h('p', { class: 'net-vote-stage' }, '玩家页投票中：已投 ' + tally.total + '／' + aliveIds().length);
    return h('p', { class: 'net-vote-stage' }, '投票结果：' + f.event.options.map(function (o, i) { return String.fromCharCode(65 + i) + ' ' + tally.counts[o.id] + ' 票'; }).join('　'));
  }

  // ---------------------------------------------------------------- 私信

  function netSendText(to, text) {
    if (!net.link) return;
    netSend(to, { kind: 'text', text: text });
    netCommit('联机私信', function (s) { log(s, '私信 ' + (to === '*' ? '所有玩家' : nameOf(to)) + '：' + text, true); });
    netFeed('私信 ' + (to === '*' ? '所有玩家' : nameOf(to)) + '：' + text);
    U.toast(to === '*' ? '已交给房间：所有已加入的玩家都会收到' : '已交给房间：' + nameOf(to) + ' 会收到', 'ok');
  }

  /** 已经写好的私信文本：对方已加入房间时，多一个「直接发到他的玩家页」。 */
  function netDmButton(pid, text) {
    if (!pid || !netReach(pid)) return null;
    return h('button', { type: 'button', class: 'btn small primary', onclick: function () { netSendText(pid, text); } }, '直接发到 ' + nameOf(pid) + ' 的玩家页');
  }

  /** 事件结果：把个人效果发给指定玩家，玩家在收件箱里点「应用」。 */
  function netEffectDialog(res) {
    var bound = state.players.filter(function (p) { return netBound(p.id); });
    if (!bound.length) { U.toast('还没有玩家加入房间', 'warn'); return; }
    var chosen = {};
    var list = h('div', { class: 'row' }, bound.map(function (p) {
      var box = h('input', { type: 'checkbox', onchange: function () { chosen[p.id] = box.checked; } });
      return h('label', { class: 'check' }, box, p.name);
    }));
    U.modal({
      title: '把事件结果发给玩家',
      body: h('div', { class: 'stack' },
        h('p', { class: 'muted small' }, '勾选受影响的玩家：他们的收件箱会收到结果通知；有个人效果时，玩家点「应用」就会自动改自己的生命、状态与物品。'),
        list,
        h('pre', { class: 'code' }, personalNotice(res, true))),
      actions: [{ label: '取消', value: false }, { label: '发送', kind: 'primary', value: true }]
    }).then(function (ok) {
      if (!ok) return;

  // ---------------------------------------------------------------- 「联机」页

  function netStatusText() {

  /** 顶栏上的小标签：有房间时显示房间码和在线人数，点了去「联机」页。 */

  function netRoomCard() {

      return h('section', { class: 'card net-room' },

  function netPlayersCard() {
    return h('section', { class: 'card' },

      })) : null,

  function netFeedCard() {

      })) : h('p', { class: 'empty' }, '还没有联机消息。'));
  }

  function netHelpCard() {
    return h('details', { class: 'card' },
      h('summary', null, h('b', null, '联机怎么用')),
      h('ul', null,
        h('li', null, '主持人开房间 → 玩家扫二维码或点加入链接 → 选自己的名字 → 主持人通过（可设为自动通过）。'),
        h('li', null, '玩家页会实时看到公开信息；轮到谁行动、领补给、投票，都在玩家自己的页面上点。'),

        h('li', null, '断线不要紧：消息先存在房间里，重新连上后自动补收；房间 14 天没有动静会自动删除。'),
        h('li', null, '局域网：在入口页下载 shelter-lan.mjs，主持人电脑运行 node shelter-lan.mjs，大家连同一个 Wi‑Fi 打开窗口里显示的地址。')));
  }

  /** 公开展示页：扫码加入。 */
  function netStageJoin() {

    var qr = ShelterNet.qrSvg(link, 220);
    return h('div', { class: 'stage-panel net-stage-join' },
      h('h3', null, '扫码加入'),
      qr ? h('div', { class: 'net-qr' }, qr) : null,
      h('div', { class: 'net-code' }, net.cfg.code),
      h('p', { class: 'muted small' }, '用手机扫码，或在玩家页输入房间码。'));
  }


  // ================================================================ 启动

  function boot() {
    var tab = U.readKey(KEY_TAB);
    if (tab && TABS.some(function (t) { return t.id === tab; })) ui.tab = tab;
    U.i18n.setLang(U.i18n.getLang());
    document.title = U.T(PAGE_TITLE);
    state = loadState();
    netBoot();
    // 从玩家的守夜卡片链接打开时，别的主持人标签页直接同步，不弹「另一个标签页修改了存档」
    if (/#watch=/.test(location.hash)) U.writeKey(KEY_SYNC, String(Date.now()));
    save();
    render();
    openWatchLink();
    setInterval(timerTick, 250);
    // 联机消息来时正在输入：离开输入框（且没在点按钮）后再补画主体
    document.addEventListener('focusout', function () { if (ui.mainStale) setTimeout(flushStale, 300); });
    document.addEventListener('pointerdown', function () { ui.pointerDown = true; }, true);
    document.addEventListener('pointerup', function () { ui.pointerDown = false; if (ui.mainStale) setTimeout(flushStale, 80); }, true);
    document.addEventListener('visibilitychange', function () { if (!document.hidden && net.link) net.link.wake(); });
    window.addEventListener('online', function () { if (net.link) net.link.wake(); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && ui.present && !document.querySelector('.overlay')) exitPresent();
    });
    document.addEventListener('fullscreenchange', function () {
      // 用浏览器自己的方式（Esc／F11）退出全屏时，一并退出展示模式
      if (!document.fullscreenElement && ui.present && ui.presentFs) exitPresent();
    });
    window.addEventListener('hashchange', openWatchLink);
    window.addEventListener('storage', function (e) {
      // 另一个标签页刚通过守夜卡片链接加了候选：直接同步，不用提示刷新
      if (e.key === KEY_SYNC) { ui.syncAt = Date.now(); return; }
      if (e.key === (slot === 'demo' ? KEY_DEMO : KEY_MAIN) && Date.now() - (ui.syncAt || 0) < 5000) {
        ui.syncAt = 0;
        state = loadState();
        render();
        U.toast('另一个标签页更新了存档：本页已重新载入', 'ok');
        return;
      }
      if (e.key === (slot === 'demo' ? KEY_DEMO : KEY_MAIN)) {
        notices.push({ kind: 'risk', text: '另一个标签页修改了同一份主持人存档。为避免互相覆盖，请只保留一个主持人标签页，然后刷新本页。' });
        render();
      }
    });
  }

  boot();
})();

<script>
/* src/fx/fx.js */
/*
 * 避难所 Playtest · 动画与音效
 *
 * 内联在主持人页、玩家页最后（页面脚本之后）。
 * 不改页面逻辑：每次页面保存存档时，对比前后两份存档得知「刚发生了什么」，
 * 等页面画好后给对应元素加动画（Web Animations），并播放现场合成的音效（Web Audio，没有音频文件，离线可用）。
 *
 * 设置（本机记住）：动画 跟随系统／开／关；音效 开／关；音量。系统开了「减少动态效果」时只淡入淡出。
 * 主持人端只给公开时刻配声音（阶段、计时、事件揭晓、营救、公开结果），秘密页里的操作不出声。
 * window.ShelterFX.log 记录触发过的效果名，供测试检查。
 */
(function () {
  'use strict';

  var U = window.ShelterUI;
  var C = window.ShelterCore;
  var T = U && U.T ? U.T : function (s) { return s; };
  var TC = U && U.TC ? U.TC : function (c, s) { return s; };
  var PAGE = document.body.classList.contains('host') ? 'host' : 'player';
  var NS = 'shelter-playtest:';
  var KEY_FX = NS + 'fx';
  var STATE_KEY = new RegExp('^' + NS.replace(/[-:]/g, '\\$&') + '(host|player)(-demo)?:v1$');
  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };

  var FX = { log: [], played: [] };
  window.ShelterFX = FX;

  // ---------------------------------------------------------------- 设置

  var settings = readSettings();

  function readSettings() {
    var s = null;
    try { s = JSON.parse(localStorage.getItem(KEY_FX)); } catch (e) { s = null; }
    s = s && typeof s === 'object' ? s : {};
    return {
      motion: s.motion === 'on' || s.motion === 'off' ? s.motion : 'auto',
      sound: s.sound !== false,
      volume: typeof s.volume === 'number' && s.volume >= 0 && s.volume <= 1 ? s.volume : 0.6
    };
  }

  function saveSettings() {
    try { localStorage.setItem(KEY_FX, JSON.stringify(settings)); } catch (e) { /* 只在本页生效 */ }
    if (master) master.gain.value = settings.volume;
  }

  /** 'full'：完整动画；'reduce'：只淡入淡出；'off'：不动 */
  function motion() {
    if (settings.motion === 'off') return 'off';
    if (settings.motion === 'auto' && reduceMQ.matches) return 'reduce';
    return 'full';
  }

  function note(name) {
    FX.log.push(name);
    if (FX.log.length > 300) FX.log.shift();
  }

  // ---------------------------------------------------------------- 声音（现场合成）

  var ctx = null;
  var master = null;
  var noiseBuf = null;
  var unlocked = false;
  var lastAt = {};
  var lastAny = 0;

  // 浏览器只允许在用户点过页面之后出声：第一次点按时才建立音频环境
  function unlock() {
    unlocked = true;
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      try {
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = settings.volume;
        master.connect(ctx.destination);
      } catch (e) { ctx = null; return; }
    }
    if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
  }
  ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
    document.addEventListener(ev, unlock, { capture: true, passive: true });
  });

  function tone(freq, start, dur, o) {
    o = o || {};
    var t0 = ctx.currentTime + start;
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain == null ? 0.2 : o.gain, t0 + (o.attack || 0.006));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function noise(start, dur, o) {
    o = o || {};
    if (!noiseBuf) {
      noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.6), ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var t0 = ctx.currentTime + start;
    var src = ctx.createBufferSource();
    var f = ctx.createBiquadFilter();
    var g = ctx.createGain();
    src.buffer = noiseBuf;
    f.type = o.filter || 'bandpass';
    f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.from || 1200, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(o.gain == null ? 0.25 : o.gain, t0 + (o.attack || 0.004));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  function bell(freq, start, gain) {
    gain = gain == null ? 0.12 : gain;
    tone(freq, start, 1.3, { gain: gain });
    tone(freq * 2.01, start, 0.8, { gain: gain * 0.35 });
    tone(freq * 3.02, start, 0.45, { gain: gain * 0.15 });
  }

  var SOUNDS = {
    deal: function () { noise(0, 0.17, { from: 700, to: 3400, q: 0.8, gain: 0.32 }); },
    flip: function () { noise(0, 0.035, { filter: 'highpass', from: 2600, gain: 0.35 }); tone(330, 0.01, 0.09, { type: 'triangle', gain: 0.14 }); },
    select: function () { tone(880, 0, 0.35, { gain: 0.16 }); tone(1320, 0.05, 0.42, { gain: 0.09 }); },
    light: function () { tone(660, 0, 0.09, { gain: 0.12, to: 990 }); bell(990, 0.06, 0.08); },
    off: function () { tone(520, 0, 0.14, { type: 'triangle', gain: 0.1, to: 360 }); },
    pop: function () { tone(620, 0, 0.09, { gain: 0.13, to: 940 }); },
    remove: function () { tone(520, 0, 0.12, { gain: 0.1, to: 240 }); },
    tick: function () { tone(1250, 0, 0.045, { type: 'square', gain: 0.05 }); },
    urgent: function () { tone(1650, 0, 0.07, { type: 'square', gain: 0.08 }); },
    alarm: function () {
      [0, 0.24, 0.48].forEach(function (s) { tone(880, s, 0.17, { type: 'square', gain: 0.1 }); tone(1320, s, 0.17, { gain: 0.06 }); });
    },
    success: function () {
      [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) { tone(f, i * 0.075, 0.32, { type: 'triangle', gain: 0.13 }); });
    },
    hurt: function () { tone(160, 0, 0.32, { gain: 0.38, to: 52 }); noise(0, 0.09, { filter: 'lowpass', from: 420, gain: 0.25 }); },
    heal: function () { tone(440, 0, 0.26, { gain: 0.11, to: 660 }); tone(660, 0.09, 0.32, { gain: 0.09, to: 990 }); },
    warn: function () { tone(330, 0, 0.12, { type: 'triangle', gain: 0.14 }); tone(262, 0.13, 0.17, { type: 'triangle', gain: 0.14 }); },
    lock: function () { noise(0, 0.03, { filter: 'highpass', from: 3000, gain: 0.3 }); tone(220, 0.025, 0.13, { type: 'square', gain: 0.07 }); },
    phase: function () { bell(659.25, 0); bell(987.77, 0.13); },
    dawn: function () { bell(523.25, 0); bell(659.25, 0.18); bell(783.99, 0.36); },
    reveal: function () { noise(0, 0.55, { from: 300, to: 4200, q: 1.1, gain: 0.18 }); bell(880, 0.5, 0.14); },
    dice: function () { for (var i = 0; i < 6; i++) noise(i * 0.065, 0.03, { from: 1500 + Math.random() * 1500, q: 5, gain: 0.32 }); },
    shuffle: function () { [0, 0.09, 0.18].forEach(function (s) { noise(s, 0.12, { from: 900, to: 2800, q: 0.9, gain: 0.22 }); }); },
    rescue: function () { [392, 523.25, 659.25, 783.99].forEach(function (f, i) { tone(f, i * 0.09, 0.4, { gain: 0.12 }); }); },
    announce: function () { bell(783.99, 0, 0.1); }
  };

  /** 播放一个音效。opts.quiet：刚有别的声音时让一让（提示框这类附带音）。 */
  function play(name, opts) {
    var now = Date.now();
    if (lastAt[name] && now - lastAt[name] < 70) return;
    if (opts && opts.quiet && now - lastAny < 250) return;
    lastAt[name] = now;
    lastAny = now;
    if (!settings.sound || !unlocked || !ctx || !SOUNDS[name]) return;
    try {
      if (ctx.state === 'suspended' && ctx.resume) ctx.resume();
      SOUNDS[name]();
      FX.played.push(name);
    } catch (e) { /* 声音失败不影响页面 */ }
  }

  function later(ms, fn) { if (ms <= 0) fn(); else setTimeout(fn, ms); }

  // ---------------------------------------------------------------- 动画

  function anim(el, frames, opts, reduced) {
    var m = motion();
    if (!el || m === 'off' || typeof el.animate !== 'function') return null;
    var o = { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' };
    for (var k in opts) if (Object.prototype.hasOwnProperty.call(opts, k)) o[k] = opts[k];
    try {
      return el.animate(m === 'reduce' ? (reduced || [{ opacity: 0.35 }, { opacity: 1 }]) : frames, o);
    } catch (e) { return null; }
  }

  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function pulse(el, scale) {
    var s = scale || 1.06;
    return anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(' + s + ')' }, { transform: 'scale(1)' }], { duration: 320 });
  }

  function glow(el, color) {
    return anim(el, [{ boxShadow: '0 0 0 0 ' + color }, { boxShadow: '0 0 0 16px rgba(0,0,0,0)' }], { duration: 650, easing: 'ease-out' }, []);
  }

  function shake(el) {
    return anim(el, [
      { transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' },
      { transform: 'translateX(-3px)' }, { transform: 'translateX(2px)' }, { transform: 'translateX(0)' }
    ], { duration: 420, easing: 'ease-out' });
  }

  function flash(el, rgba) {
    return anim(el, [{ boxShadow: 'inset 0 0 0 999px ' + rgba }, { boxShadow: 'inset 0 0 0 999px rgba(0,0,0,0)' }], { duration: 700, easing: 'ease-out' }, []);
  }

  function slideIn(el, delay, dx, dy) {
    return anim(el, [
      { opacity: 0, transform: 'translate(' + (dx || 0) + 'px,' + (dy == null ? 10 : dy) + 'px)' },
      { opacity: 1, transform: 'translate(0,0)' }
    ], { duration: 320, delay: delay || 0 });
  }

  function popIn(el, delay) {
    return anim(el, [
      { opacity: 0, transform: 'scale(.88)' }, { opacity: 1, transform: 'scale(1.03)', offset: 0.7 }, { opacity: 1, transform: 'scale(1)' }
    ], { duration: 360, delay: delay || 0 });
  }

  // ---------------------------------------------------------------- 卡片：发牌、翻面、选中

  /** 牌背朝上滑进来，翻到一半拿掉牌背，再翻到正面。withSound=false 用在主持人的秘密弹窗里。 */
  function dealCards(els, withSound) {
    note('deal');
    els.forEach(function (el, i) {
      var d = i * 170;
      if (withSound !== false) {
        later(d, function () { play('deal'); });
        later(d + 530, function () { play('flip'); });
      }
      var m = motion();
      if (m === 'off') return;
      if (m === 'reduce') { anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 300, delay: d }); return; }
      var back = document.createElement('span');
      back.className = 'fx-cardback';
      back.setAttribute('aria-hidden', 'true');
      el.appendChild(back);
      var drop = function () { if (back.parentNode) back.parentNode.removeChild(back); };
      var a1 = anim(el, [
        { transform: 'translateY(52px) rotate(-8deg) scale(.82)', opacity: 0 },
        { transform: 'translateY(0) rotate(0deg) scale(1)', opacity: 1 }
      ], { duration: 380, delay: d });
      if (!a1 || !a1.finished) { drop(); return; }
      a1.finished.then(function () {
        var a2 = el.animate([{ transform: 'perspective(700px) rotateY(0deg)' }, { transform: 'perspective(700px) rotateY(90deg)' }], { duration: 150, easing: 'ease-in' });
        return a2.finished;
      }).then(function () {
        drop();
        var a3 = el.animate([{ transform: 'perspective(700px) rotateY(-90deg)' }, { transform: 'perspective(700px) rotateY(0deg)' }], { duration: 230, easing: 'cubic-bezier(.2,.8,.2,1)' });
        if (el.classList.contains('is-all')) a3.finished.then(function () { glow(el, 'rgba(180,84,14,.6)'); });
      }).catch(drop);
      // 保险：无论动画怎样结束，牌背都不会留在卡面上
      setTimeout(drop, d + 1500);
    });
  }

  /** 抽签：名字在候选之间越翻越慢，最后停在抽中的那件（结果早已存档，动画只是表演）。不出声。 */
  function roulette(el, names, after) {
    note('roulette');
    var m = motion();
    var final = el ? el.textContent : '';
    var others = (names || []).filter(function (n) { return n && n !== final; });
    if (!el || m === 'off' || !others.length) { if (after) after(); return; }
    if (m === 'reduce') { anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 }); if (after) after(); return; }
    var steps = [0, 60, 125, 195, 275, 365, 470, 590, 730];
    steps.forEach(function (t, i) {
      later(t, function () {
        if (!el.isConnected) return;
        if (i === steps.length - 1) {
          el.textContent = final;
          pulse(el, 1.08);
          if (after) after();
        } else {
          el.textContent = others[(i + Math.floor(Math.random() * others.length)) % others.length];
        }
      });
    });
  }

  function pickCard(el) {
    note('select');
    play('select');
    if (!el) return;
    pulse(el, 1.06);
    glow(el, 'rgba(15,110,102,.45)');
  }

  // ---------------------------------------------------------------- 玩家页：对比前后两份存档

  function cardKey(plan) {
    return plan && plan.v === 2 && plan.cards ? plan.cards.map(function (c) { return c.id; }).join(',') : '';
  }

  function todayAction(s) {
    var a = s.action;
    return a && a.used && s.publicInfo && a.day === s.publicInfo.day ? a.type || 'other' : null;
  }

  function invMap(list) {
    var m = {};
    (list || []).forEach(function (e) { if (e && e.id) m[e.id] = e.qty == null ? 1 : e.qty; });
    return m;
  }

  function playerDiff(a, b) {
    var fx = [];

    // 守夜卡：抽到新的一对 → 发牌；换了选中的那张 → 选中
    var ka = cardKey(a.watchPlan);
    var kb = cardKey(b.watchPlan);
    if (kb && kb !== ka) {
      fx.push(function () { dealCards($$('.watch-section .wcard')); });
    } else if (kb && b.watchPlan.chosen != null && b.watchPlan.chosen !== a.watchPlan.chosen) {
      fx.push(function () {
        pickCard($('.watch-section .wcard.on'));
        if (a.watchPlan.chosen == null) slideIn($('.watch-section .share-row'), 120);
      });
    }

    // 今天的行动：点亮／取消
    var oa = todayAction(a);
    var ob = todayAction(b);
    if (ob && ob !== oa) {
      fx.push(function () {
        note('light');
        play('light');
        var btn = $('[data-action="' + ob + '"]');
        pulse(btn, 1.05);
        glow(btn, 'rgba(15,110,102,.45)');
        if (ob === 'plan') slideIn($('.watch-section'), 80);
      });
    } else if (!ob && oa && a.publicInfo.day === b.publicInfo.day) {
      fx.push(function () { note('off'); play('off'); });
    }

    // 生命
    if (typeof a.hp === 'number' && typeof b.hp === 'number' && a.hp !== b.hp) {
      var down = b.hp < a.hp;
      fx.push(function () {
        var cell = $('[data-vital="hp"]');
        note(down ? 'hurt' : 'heal');
        play(down ? 'hurt' : 'heal');
        if (down) { shake(cell); flash(cell, 'rgba(200,45,30,.28)'); } else { glow(cell, 'rgba(15,110,102,.45)'); }
      });
    }

    // 搜刮：新一轮发选项；选完或超时；全部结束
    var sa = a.scavenge;
    var sb = b.scavenge;
    if (sb && sb.status === 'running') {
      var na = sa && sa.id === sb.id && sa.status === 'running' ? sa.rounds.length : 0;
      if (sb.rounds.length > na) {
        var prevRound = na ? sb.rounds[na - 1] : null;
        fx.push(function () {
          if (prevRound && prevRound.choice != null) { note(prevRound.auto ? 'auto' : 'choose'); play(prevRound.auto ? 'warn' : 'select'); }
          note('round');
          later(prevRound ? 140 : 0, function () { play('shuffle'); });
          $$('.scav-option').forEach(function (el, i) { slideIn(el, 60 + i * 90, 0, 18); });
        });
      }
    }
    if (sa && sa.status === 'running' && sb && sb.id === sa.id && sb.status !== 'running') {
      var last = sb.rounds[sb.rounds.length - 1];
      fx.push(function () {
        if (last && last.choice != null) play(last.auto ? 'warn' : 'select');
        note('scavenge-done');
        later(260, function () { play('success'); });
      });
    }

    // 携带：确认后锁定；结束携带
    var la = !!(a.loadout && a.loadout.confirmed);
    var lb = !!(b.loadout && b.loadout.confirmed);
    if (lb && !la) fx.push(function () { note('lock'); play('lock'); $$('.inv-card.is-carried').forEach(function (el, i) { later(i * 60, function () { pulse(el, 1.04); }); }); });
    else if (la && !lb) fx.push(function () { note('unlock'); play('off'); });

    // 库存：新物品弹出来；数量变多跳一下；少了只出声
    var ia = invMap(a.inventory);
    var ib = invMap(b.inventory);
    var added = [];
    var grew = [];
    var lost = false;
    Object.keys(ib).forEach(function (id) {
      if (ia[id] == null) added.push(id);
      else if (ib[id] > ia[id]) grew.push(id);
      else if (ib[id] < ia[id]) lost = true;
    });
    Object.keys(ia).forEach(function (id) { if (ib[id] == null) lost = true; });
    if (added.length || grew.length) {
      fx.push(function () {
        note('item');
        play('pop');
        added.forEach(function (id, i) {
          var el = $('.inv-card[data-entry="' + id + '"]');
          popIn(el, i * 45);
          later(i * 45 + 200, function () { glow(el, 'rgba(15,110,102,.35)'); });
        });
        grew.forEach(function (id) { pulse($('.inv-card[data-entry="' + id + '"] .qty'), 1.3); });
      });
    } else if (lost) {
      fx.push(function () { note('item-out'); play('remove'); });
    }

    fx.push(vitalsCheck);
    return fx;
  }

  // 状态栏其他格子（饥饿、口渴、意识、库存、负面状态）：按格子的严重程度变化决定动画
  var RANK = { ok: 0, info: 1, warn: 2, crit: 3 };
  var vitals = {};
  function readVital(el) {
    var m = /\blv-(\w+)\b/.exec(el.className);
    return { rank: m && RANK[m[1]] != null ? RANK[m[1]] : 0, text: (el.querySelector('.vcell-value') || el).textContent };
  }
  function vitalsCheck(silent) {
    $$('[data-vital]').forEach(function (el) {
      var key = el.getAttribute('data-vital');
      var now = readVital(el);
      var was = vitals[key];
      vitals[key] = now;
      if (silent === true || !was || key === 'hp' || was.text === now.text) return;
      if (now.rank > was.rank) { note('worse:' + key); shake(el); flash(el, 'rgba(180,84,14,.25)'); play('warn', { quiet: true }); }
      else if (now.rank < was.rank) { note('better:' + key); glow(el, 'rgba(15,110,102,.45)'); play('heal', { quiet: true }); }
      else pulse(el, 1.04);
    });
  }

  // ---------------------------------------------------------------- 主持人页：对比前后两份存档（只给公开时刻配声音）

  function hostDiff(a, b) {
    var fx = [];

    if (a.phase !== b.phase || a.day !== b.day) {
      var dawn = b.day > a.day;
      fx.push(function () {
        note(dawn ? 'dawn' : 'phase');
        play(dawn ? 'dawn' : 'phase');
        slideIn($('.hero-phase'), 0, 0, 12);
        anim($('.track-seg.on .track-bar'), [{ transform: 'scaleX(0)', transformOrigin: 'left center' }, { transform: 'scaleX(1)', transformOrigin: 'left center' }], { duration: 520 });
        var step = $('.rail-step.on button');
        pulse(step, 1.12);
        glow(step, 'rgba(15,110,102,.45)');
      });
    }

    var ta = a.timer || {};
    var tb = b.timer || {};
    if (ta.running && !tb.running && tb.remainingMs === 0) {
      fx.push(function () {
        note('alarm');
        play('alarm');
        anim($('#timer-display'), [{ opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }, { opacity: 0.2 }, { opacity: 1 }], { duration: 1100, easing: 'linear' }, []);
        flash($('.timer'), 'rgba(180,84,14,.22)');
      });
    } else if (!ta.running && tb.running) {
      fx.push(function () { note('timer-start'); play('pop'); pulse($('#timer-display'), 1.05); });
    }

    var ea = a.stage && a.stage.event;
    var eb = b.stage && b.stage.event;
    if (eb && (!ea || ea.flowId !== eb.flowId || ea.name !== eb.name)) {
      fx.push(function () {
        note('reveal');
        play('reveal');
        anim($('.stage-event'), [
          { opacity: 0, transform: 'perspective(900px) rotateX(-75deg)', transformOrigin: 'top center' },
          { opacity: 1, transform: 'perspective(900px) rotateX(0deg)', transformOrigin: 'top center' }
        ], { duration: 650 });
        $$('.stage-event .vote-option').forEach(function (el, i) { slideIn(el, 450 + i * 110, 0, 8); });
      });
    }

    // 主持人随机抽取事件（秘密区）：名字翻动后停下，细节再淡入；不出声
    var da = a.today && a.today.eventDraw;
    var db = b.today && b.today.eventDraw;
    if (db && (!da || da.at !== db.at)) {
      var names = (db.poolIds || []).map(function (id) {
        var e = (b.events || []).filter(function (x) { return x.id === id; })[0];
        return e ? e.name : '';
      });
      fx.push(function () {
        var body = $('.event-draw-body');
        if (body && motion() !== 'off') body.style.visibility = 'hidden';
        roulette($('.event-draw-name'), names, function () {
          if (!body) return;
          body.style.visibility = '';
          slideIn(body, 0, 0, 8);
          glow($('.event-draw'), 'rgba(15,110,102,.4)');
        });
      });
    }

    var ca = a.today && a.today.eventCheck;
    var cb = b.today && b.today.eventCheck;
    if (cb && (!ca || ca.at !== cb.at)) {
      fx.push(function () { note('dice'); play('dice'); later(420, function () { pulse($('.event-check'), 1.08); }); });
    }

    if (typeof a.rescueProgress === 'number' && typeof b.rescueProgress === 'number' && a.rescueProgress !== b.rescueProgress) {
      var up = b.rescueProgress > a.rescueProgress;
      fx.push(function () {
        note(up ? 'rescue' : 'rescue-down');
        play(up ? 'rescue' : 'remove');
        pulse($('.rescue-value'), 1.18);
        if (up) glow($('.rescue-panel'), 'rgba(15,110,102,.45)');
      });
    }

    var fa = (a.publicFeed || []).length;
    var fb = (b.publicFeed || []).length;
    if (fb > fa) {
      fx.push(function () {
        note('announce');
        play('announce');
        $$('.feed li').slice(0, fb - fa).forEach(function (el, i) { slideIn(el, i * 90, -14, 0); });
      });
    }

    var sa = (a.seatOrder || []).join(',');
    var sb = (b.seatOrder || []).join(',');
    if (sa && sb && sa !== sb && (a.seatOrder || []).length === (b.seatOrder || []).length) {
      fx.push(function () {
        note('shuffle');
        play('shuffle');
        $$('.seat-list li, tr[data-player]').forEach(function (el, i) { slideIn(el, i * 50, -10, 0); });
      });
    }
    return fx;
  }

  // ---------------------------------------------------------------- 听存档写入

  var prev = {};
  var cur = null;

  function activeKey() {
    var slot = null;
    try { slot = localStorage.getItem(NS + PAGE + ':slot'); } catch (e) { slot = null; }
    return NS + PAGE + (slot === 'demo' ? '-demo' : '') + ':v1';
  }

  try { cur = JSON.parse(localStorage.getItem(activeKey())); prev[activeKey()] = cur; } catch (e) { cur = null; }

  function sameSave(a, b) {
    return a && b && a.createdAt === b.createdAt && (PAGE === 'host' || a.playerId === b.playerId);
  }

  function isUndo(a, b) {
    var n = b.log && b.log[0];
    var o = a.log && a.log[0];
    return !!(n && /^撤销：/.test(n.text || '') && (!o || o.id !== n.id));
  }

  function onSave(key, json) {
    var next;
    try { next = JSON.parse(json); } catch (e) { return; }
    var before = prev[key];
    prev[key] = next;
    cur = next;
    // 换了存档（新建、导入、重置、切换演示）或撤销：只记下新状态，不放效果
    if (!sameSave(before, next) || isUndo(before, next)) {
      if (PAGE === 'player') requestAnimationFrame(function () { vitalsCheck(true); });
      return;
    }
    var list;
    try { list = PAGE === 'host' ? hostDiff(before, next) : playerDiff(before, next); } catch (e) { return; }
    if (!list.length) return;
    // 页面在保存之后立刻重画：等到下一帧，元素都在了再动
    requestAnimationFrame(function () {
      list.forEach(function (fn) { try { fn(); } catch (e) { /* 效果出错不影响页面 */ } });
    });
  }

  var origSet = Storage.prototype.setItem;
  Storage.prototype.setItem = function (k, v) {
    origSet.apply(this, arguments);
    if (this === window.localStorage && STATE_KEY.test(k)) onSave(k, v);
  };

  // ---------------------------------------------------------------- 倒计时：最后几秒滴答

  var lastSec = null;
  setInterval(function () {
    if (!cur) return;
    var deadline = null;
    var warnFrom = 3;
    var el = null;
    if (PAGE === 'host') {
      var tm = cur.timer;
      if (tm && tm.running && tm.endsAt) { deadline = tm.endsAt; warnFrom = 10; el = document.getElementById('timer-display'); }
    } else if (cur.scavenge && cur.scavenge.status === 'running' && C && C.currentScavengeRound) {
      var r = C.currentScavengeRound(cur.scavenge);
      if (r) { deadline = r.deadline; el = document.getElementById('scav-clock'); }
    }
    if (!deadline) { lastSec = null; return; }
    var sec = Math.ceil((deadline - Date.now()) / 1000);
    if (el) el.classList.toggle('fx-hot', sec <= warnFrom && sec > 0);
    if (sec === lastSec) return;
    lastSec = sec;
    if (sec < 1 || sec > warnFrom) return;
    note(sec <= 3 ? 'urgent' : 'tick');
    play(sec <= 3 ? 'urgent' : 'tick');
    if (el) pulse(el, sec <= 3 ? 1.18 : 1.08);
  }, 100);

  // ---------------------------------------------------------------- 页面里的其他时刻

  // 按下的手感：按钮、卡片、状态格子轻轻一沉
  document.addEventListener('pointerdown', function (e) {
    var el = e.target && e.target.closest && e.target.closest('.btn, .action-btn, .wcard, .scav-option, .vcell, .tab, .fx-pill');
    if (el && !el.disabled) anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(.96)' }, { transform: 'scale(1)' }], { duration: 180, easing: 'ease-out' }, []);
  }, { capture: true, passive: true });

  // 弹窗里出现守夜卡（主持人打开玩家的链接）：翻牌，但不出声（秘密页）
  var modalRoot = document.getElementById('modal-root');
  if (modalRoot && window.MutationObserver) {
    new MutationObserver(function (records) {
      records.forEach(function (r) {
        Array.prototype.forEach.call(r.addedNodes, function (n) {
          if (n.nodeType !== 1) return;
          var cards = n.matches && n.matches('.wcard') ? [n] : $$('.modal .wcard', n);
          if (cards.length) requestAnimationFrame(function () { dealCards(cards, false); });
        });
      });
    }).observe(modalRoot, { childList: true, subtree: true });
  }

  // 提示框：成功轻响一声，警告低两声（刚有别的声音时让一让）
  var toastRoot = document.getElementById('toast');
  if (toastRoot && window.MutationObserver) {
    new MutationObserver(function (records) {
      records.forEach(function (r) {
        Array.prototype.forEach.call(r.addedNodes, function (n) {
          if (n.nodeType !== 1 || !n.classList.contains('toast')) return;
          if (n.classList.contains('warn')) play('warn', { quiet: true });
          else if (n.classList.contains('ok')) play('pop', { quiet: true });
        });
      });
    }).observe(toastRoot, { childList: true });
  }

  // ---------------------------------------------------------------- 左下角的设置

  var SVG_NS = 'http://www.w3.org/2000/svg';
  function noteIcon() {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    var p = document.createElementNS(SVG_NS, 'path');
    p.setAttribute('d', settings.sound ? 'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm11-2a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z' : 'M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0ZM3 3l18 18');
    svg.appendChild(p);

  }

  function el(tag, attrs, kids) {

      else if (attrs[k] != null && attrs[k] !== false) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);

  function seg(options, value, onPick) {
    return el('div', { class: 'fx-seg', role: 'group' }, options.map(function (o) {
      return el('button', { type: 'button', 'aria-pressed': o[0] === value ? 'true' : 'false', 'data-fx': String(o[0]), text: o[1] === '开' || o[1] === '关' ? TC('switch', o[1]) : T(o[1]), onclick: function () { onPick(o[0]); } });
    }));
  }

  var TRY = [['deal', '发牌'], ['flip', '翻牌'], ['select', '选中'], ['tick', '滴答'], ['alarm', '时间到'], ['phase', '阶段'], ['reveal', '揭晓'], ['hurt', '受伤'], ['success', '完成']];
  var dock = null;
  var panelOpen = false;

  function buildDock() {
    var keep = panelOpen;
    if (dock && dock.parentNode) dock.parentNode.removeChild(dock);
    var panel = el('div', { class: 'fx-panel', role: 'dialog', 'aria-label': T('动画与音效'), hidden: !keep }, [
      el('div', { class: 'fx-head' }, [el('b', { text: T('动画与音效') })]),
      el('p', { class: 'fx-note', text: PAGE === 'host'
        ? T('只在公开时刻出声（阶段、计时、事件、营救、公开结果），秘密页里的操作不出声；屏幕共享带声音时大家都能听到。')
        : T('浏览器要求先点一下页面才会出声。设置只记在这台设备上。') }),
      el('div', { class: 'fx-row' }, [el('span', { text: T('动画') }), seg([['auto', '跟随系统'], ['on', '开'], ['off', '关']], settings.motion, function (v) { settings.motion = v; saveSettings(); buildDock(); })]),
      el('div', { class: 'fx-row' }, [el('span', { text: T('音效') }), seg([[true, '开'], [false, '关']], settings.sound, function (v) { settings.sound = v; saveSettings(); unlock(); buildDock(); })]),
      el('label', { class: 'fx-row' }, [el('span', { text: T('音量') }), (function () {
        var r = el('input', { type: 'range', min: '0', max: '100', step: '5', value: String(Math.round(settings.volume * 100)), 'aria-label': T('音量') });
        r.addEventListener('input', function () { settings.volume = Number(r.value) / 100; saveSettings(); });
        r.addEventListener('change', function () { play('select'); });
        return r;
      })()]),
      el('div', { class: 'fx-row' }, [el('span', { text: T('试听') }), el('div', { class: 'fx-try' }, TRY.map(function (t) {
        return el('button', { type: 'button', 'data-try': t[0], text: T(t[1]), onclick: function () { unlock(); note('try:' + t[0]); play(t[0]); } });
      }))])
    ]);
    var pill = el('button', {
      type: 'button', class: 'fx-pill' + (settings.sound ? '' : ' muted'), 'aria-expanded': keep ? 'true' : 'false',
      'aria-label': T('动画与音效'), title: T('动画与音效'),
      onclick: function () { panelOpen = !panelOpen; panel.hidden = !panelOpen; pill.setAttribute('aria-expanded', panelOpen ? 'true' : 'false'); }
    }, [noteIcon()]);
    dock = el('div', { class: 'fx-dock' }, [panel, pill]);
    document.body.appendChild(dock);
  }

  document.addEventListener('click', function (e) {
    // 面板里的按钮会重建面板：点到的元素已经离开页面，但仍在旧的 .fx-dock 里
    if (!panelOpen || !dock || (e.target.closest && e.target.closest('.fx-dock'))) return;
    panelOpen = false;
    buildDock();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && panelOpen) { panelOpen = false; buildDock(); }
  });

  // 切换语言后设置面板跟着换
  if (window.MutationObserver) {
    new MutationObserver(function () { buildDock(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
  }

  buildDock();
  if (PAGE === 'player') vitalsCheck(true);

  FX.settings = function () { return { motion: settings.motion, sound: settings.sound, volume: settings.volume }; };
  FX.play = play;
  FX.motion = motion;
})();
</script>
</body>
</html>
