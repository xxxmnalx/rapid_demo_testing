<style>
/* src/shared/base.css */
/* 避难所 Playtest · 共享样式
 * 暖白底；青绿＝资源与进程；橙＝风险；红只用于严重警告。
 * 状态一律同时显示文字与数值，不只靠颜色。字体只用系统字体，不加载远程资源。 */

:root {
  --bg: #faf6ee;
  --surface: #fffdf8;
  --surface-2: #f4efe4;
  --surface-3: #ece5d6;
  --ink: #2a2620;
  --ink-2: #57504a;
  --muted: #847b70;
  --line: #e3dacb;
  --line-strong: #cfc4b1;
  --teal: #0f6e66;
  --teal-strong: #0b5a53;
  --teal-soft: #dcefe9;
  --orange: #b4540e;
  --orange-soft: #fbe9d6;
  --red: #b42318;
  --red-soft: #fde5e1;
  --violet: #5b4a8a;
  --violet-soft: #ebe6f6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(60, 40, 10, 0.06), 0 4px 14px rgba(60, 40, 10, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 650; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
h4 { font-size: 15px; }
p { margin: 0 0 8px; }
ul, ol { margin: 0; padding-left: 20px; }
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
.offscreen { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.hidden { display: none !important; }
.grow { flex: 1 1 auto; min-width: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.icon { display: inline-flex; vertical-align: -2px; }
.icon svg { display: block; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }
.grid2 > .card, .grid3 > .card, .stack > .card { margin-top: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: 8px; }
.card.inset { background: var(--surface-2); box-shadow: none; }
.section-note { color: var(--muted); font-size: 13px; margin-top: -4px; margin-bottom: 10px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  font-size: 15px;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn:focus-visible, .seg:focus-visible, .tab:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-strong); }
.btn.risk { background: var(--orange-soft); border-color: #e7b88d; color: var(--orange); }
.btn.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 30px; padding: 3px 10px; font-size: 14px; }
.btn.big { min-height: 48px; padding: 10px 20px; font-size: 17px; }
.btn.icon-btn { padding: 4px 8px; min-width: 34px; }
.btn-link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* ---------- 表单 ---------- */
input[type="text"], input[type="number"], input:not([type]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fff;
  padding: 7px 10px;
  min-height: 36px;
  max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input.num { width: 84px; text-align: center; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(15, 110, 102, 0.35); border-color: var(--teal); }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--teal); vertical-align: -3px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.field-hint { font-size: 12.5px; color: var(--muted); }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.stepper { display: inline-flex; gap: 4px; align-items: center; }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; }
.seg:last-child { border-right: 0; }
.seg.on { background: var(--teal); color: #fff; font-weight: 600; }

/* ---------- 标签 ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.badge.rule-confirmed { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.badge.rule-tentative { background: #fff5d6; border-color: #ecd68f; color: #7a5c00; }
.badge.rule-pending { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.rule-impl { background: #e7eef8; border-color: #c4d4ea; color: #2c4f7c; }
.badge.rule-draft { background: var(--violet-soft); border-color: #d2c8ec; color: var(--violet); }
.badge.rule-custom { background: var(--surface-3); }
.badge.rule-demo, .badge.demo { background: #fff0c2; border-color: #e7c55c; color: #6b5100; }
.badge.risk { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }
.badge.ok { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.pending-tag { display: inline-block; font-size: 13px; color: var(--orange); background: var(--orange-soft); border: 1px dashed #e2b585; border-radius: 6px; padding: 1px 7px; }

.callout { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.callout.risk { background: var(--orange-soft); border-color: #eccaa6; color: #6a3205; }
.callout.danger { background: var(--red-soft); border-color: #f0b4ab; color: #7a1610; }
.callout.ok { background: var(--teal-soft); border-color: #b4dbd2; color: #0b4a44; }
.callout.info { background: #eef3f8; border-color: #cfdcea; color: #2c4058; }

/* ---------- 进度条（文字＋数值） ---------- */
.meter { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--teal); border-radius: 999px; }
.meter.over > span { background: var(--orange); }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th, .tbl td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.tbl tr.current td { background: var(--teal-soft); }
.tbl tr.done td { color: var(--muted); }

.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain > li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-plain > li:last-child { border-bottom: 0; }

/* ---------- 复制交接文本 ---------- */
.copy-block { display: flex; flex-direction: column; gap: 6px; }
.copy-text { font-size: 14px; background: #fffef9; font-family: var(--font); }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- 弹窗与提示 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(42, 32, 20, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 18px 50px rgba(30, 20, 0, 0.25); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal.wide { width: min(760px, 100%); }
.modal-title { font-size: 18px; }
.modal-body { display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(92vw, 420px); pointer-events: none; }
.toast { background: #2f2a24; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); transition: opacity 0.4s, transform 0.4s; }
.toast.ok { background: var(--teal-strong); }
.toast.warn { background: #8a4210; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ---------- 横幅 ---------- */
.banner { padding: 8px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.banner.demo { background: #fff0c2; color: #5a4300; }
.banner.danger { background: var(--red-soft); color: #7a1610; }
.banner.risk { background: var(--orange-soft); color: #6a3205; }
.banner.info { background: #eef3f8; color: #2c4058; }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.tab { border: 0; background: none; padding: 11px 13px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
.tab.on { color: var(--teal-strong); border-bottom-color: var(--teal); font-weight: 650; }

.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ---------- 秘密遮挡：内容根本不渲染，只显示这张卡 ---------- */
.gate { text-align: center; padding: 26px 16px; border-style: dashed; background: var(--surface-2); }
.gate h3 { margin: 6px 0; justify-content: center; }
.gate .gate-icon { color: var(--muted); }
.gate .gate-icon .icon svg { width: 28px; height: 28px; }
.reveal-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; background: var(--orange-soft); border: 1px solid #eccaa6; color: #6a3205; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }

@media (max-width: 640px) {
  /* 英文按钮文字较长：窄屏上允许换行，而不是把页面撑宽 */
  .btn { white-space: normal; max-width: 100%; text-align: center; }
  .btn.small, .btn.icon-btn, .lang-btn { white-space: nowrap; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 13px; }
}

/* ---------- 仪表盘部件：指标卡、状态徽章（图标＋文字＋颜色）、同色相进度条 ---------- */
.tile {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow);
  font: inherit; color: inherit;
}
.tile:hover { border-color: var(--line-strong); }
.tile:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.tile-label { font-size: 13.5px; color: var(--ink-2); }
.tile-value { font-size: 24px; font-weight: 650; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.tile-unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile-sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

/* 状态徽章：图标形状 + 文字 + 颜色 */
.sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; line-height: 1; padding: 4px 8px 4px 6px; border-radius: 999px; white-space: nowrap; }
.sev .icon svg { width: 14px; height: 14px; }
.sev-ok { background: var(--teal-soft); color: var(--teal-strong); }
.sev-info { background: var(--surface-2); color: var(--ink-2); }
.sev-warn { background: var(--orange-soft); color: #8a3f08; }
.sev-crit { background: var(--red-soft); color: var(--red); }

/* 进度条：同一色相，轨道取浅色阶 */
.meter2 { display: block; height: 8px; border-radius: 4px; overflow: hidden; }
.meter2-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.m-ok { background: var(--teal-soft); } .m-ok .meter2-fill { background: var(--teal); }
.m-warn { background: var(--orange-soft); } .m-warn .meter2-fill { background: var(--orange); }
.m-crit { background: var(--red-soft); } .m-crit .meter2-fill { background: var(--red); }
.m-info { background: var(--surface-3); } .m-info .meter2-fill { background: var(--muted); }

/* ---------- 语言切换 ---------- */
.lang-btn { min-width: 44px; font-weight: 650; letter-spacing: 0.02em; white-space: nowrap; flex: 0 0 auto; }

/* ---------- 守夜候选卡（两端共用） ---------- */
.watch-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 8px 0; }
.watch-card {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; padding: 12px 14px;
  border-radius: 12px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit;
}
button.watch-card { cursor: pointer; }
button.watch-card:hover { border-color: var(--teal); }
button.watch-card:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.watch-card.on { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); background: #f6fbf9; }
.watch-card-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.watch-card-label { display: inline-flex; min-width: 26px; height: 26px; padding: 0 6px; align-items: center; justify-content: center; border-radius: 8px; background: var(--surface-3); color: var(--ink); font-weight: 700; }
.watch-card.on .watch-card-label { background: var(--teal); color: #fff; }
.watch-card-title { flex: 1 1 auto; min-width: 0; }
.watch-card-picked { display: inline-flex; align-items: center; gap: 3px; color: var(--teal-strong); font-weight: 650; }
.watch-card-picked .icon svg { width: 14px; height: 14px; }
.watch-card-who { font-size: 17px; font-weight: 700; line-height: 1.35; }
.watch-card-tend { font-size: 14px; padding-left: 8px; border-left: 3px solid var(--line-strong); }
.watch-card-tend.tend-rescue { border-left-color: var(--teal); color: var(--teal-strong); }
.watch-card-tend.tend-danger { border-left-color: var(--orange); color: #8a3f08; }
.watch-card-fx { display: flex; flex-wrap: wrap; gap: 4px; }
.watch-card-fx .fx { font-size: 13px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); }
.code-reader { display: flex; flex-direction: column; gap: 6px; padding: 10px; border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-2); margin-bottom: 10px; }

/* ---------- 守夜卡（第2版）：竖版卡面，四个位置固定 ---------- */
.wcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 8px 0; max-width: 560px; }
.wcard-slot { display: flex; flex-direction: column; align-items: stretch; gap: 6px; min-width: 0; container-type: inline-size; }
.wcard {
  position: relative; display: grid; grid-template-rows: auto 1fr auto; align-items: center; gap: 6px;
  aspect-ratio: 3 / 4; width: 100%; padding: 12px 10px 10px; text-align: center;
  border-radius: 14px; border: 2px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit;
  box-shadow: var(--shadow);
}
button.wcard { cursor: pointer; }
button.wcard:hover { border-color: var(--teal); }
button.wcard:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 2px; }
.wcard.on { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft), var(--shadow); }
.wcard-line { align-self: start; min-height: 2.6em; font-size: 13px; font-size: clamp(12px, 6cqi, 16px); line-height: 1.3; color: var(--ink-2); font-style: italic; text-wrap: balance; }
.wcard-names { display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.wcard-name { font-size: 20px; font-size: clamp(16px, 12cqi, 28px); font-weight: 750; line-height: 1.2; overflow-wrap: anywhere; }
.wcard-corners { align-self: end; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; font-size: clamp(10.5px, 5cqi, 14px); line-height: 1.25; color: var(--ink-2); text-wrap: balance; }
/* 图标贴在左下／右下角，文字在图标上方，各占半张卡宽 */
.wcard-corner { display: flex; gap: 3px; min-height: 30px; min-width: 0; }
.wcard-corner.left { flex-direction: column-reverse; align-items: flex-start; text-align: left; }
.wcard-corner.right { flex-direction: column; align-items: flex-end; text-align: right; }
.wcard-corner .icon { flex: 0 0 auto; color: var(--teal-strong); }
.wcard-corner .icon svg { width: 22px; height: 22px; }
.wcard.is-all { grid-template-rows: 1fr; background: var(--ink); border-color: var(--ink); color: #fff; }
.wcard.is-all.on { box-shadow: 0 0 0 3px var(--teal), var(--shadow); }
.wcard-all { font-size: 22px; font-size: clamp(18px, 13cqi, 34px); font-weight: 750; line-height: 1.35; padding: 0 6px; text-wrap: balance; }
.wcard-picked, .wcard-caption { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 13px; }
.wcard-picked { color: var(--teal-strong); font-weight: 650; }
.wcard-picked .icon svg { width: 14px; height: 14px; }
.wcard-caption { color: var(--muted); }
.share-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.share-row input { flex: 1 1 220px; min-width: 0; font-size: 13px; }

/* 一键重置（主持人页、玩家页的存档卡里） */
.reset-box { margin-top: 12px; border-color: #f0b4ab; }

<style>
/* src/host/host.css */
/* 主持人端：桌面优先（主持台＋屏幕共享），平板与手机也能用。
 * 版面逻辑：顶栏＝每页都要的进度与操作；标签按「可共享 → 秘密 → 设置」分组；
 * 主持台＝阶段轨 + 当前阶段（主区）+ 待办／概况（侧栏）；公开展示＝阶段（最大字）+ 轮到谁 + 计时与营救。 */

body.host { min-width: 320px; }
.tile-value, .rescue-big, .rescue-value, .timer-display, .stat-value { font-variant-numeric: tabular-nums; }

/* ---------- 顶栏 ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-main { display: flex; align-items: center; gap: 8px 18px; padding: 8px 16px; flex-wrap: wrap; }

/* ---------- 左下角的「动画与音效」开关 ---------- */
.fx-dock { position: fixed; left: 12px; bottom: 16px; z-index: 40; font-size: 14px; }
body.presenting .fx-dock { display: none; }
@media (max-width: 719px) {
  body.player .fx-dock { bottom: calc(64px + env(safe-area-inset-bottom)); left: 8px; }
}
.fx-pill {
  position: relative; display: inline-grid; place-items: center; width: 42px; height: 42px; padding: 0;
  border-radius: 50%; border: 1px solid var(--line-strong, #cfc4b1); background: var(--surface, #fffdf8); color: var(--teal-strong, #0b5a53);
  box-shadow: 0 4px 14px rgba(60, 40, 10, 0.14); cursor: pointer;
}
.fx-pill:hover { border-color: var(--teal, #0f6e66); }
.fx-pill:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 2px; }
.fx-pill svg { width: 20px; height: 20px; }
.fx-pill.muted { color: var(--muted, #847b70); }
.fx-panel {
  position: absolute; left: 0; bottom: calc(100% + 10px); width: min(330px, calc(100vw - 20px));
  display: flex; flex-direction: column; gap: 10px; padding: 14px;
  background: var(--surface, #fffdf8); color: var(--ink, #2a2620); border: 1px solid var(--line, #e3dacb); border-radius: 14px;
  box-shadow: 0 12px 32px rgba(60, 40, 10, 0.2);
}
.fx-panel[hidden] { display: none; }
.fx-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.fx-head b { font-size: 16px; }
.fx-note { margin: 0; color: var(--muted, #847b70); font-size: 12.5px; line-height: 1.5; }
.fx-row { display: grid; grid-template-columns: 52px minmax(0, 1fr); align-items: center; gap: 8px; }
.fx-row > span:first-child { color: var(--ink-2, #57504a); font-weight: 650; }
.fx-seg { display: flex; flex-wrap: wrap; gap: 4px; }
.fx-seg button, .fx-try button {
  font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line-strong, #cfc4b1); background: var(--surface, #fffdf8); color: var(--ink, #2a2620);
}
.fx-seg button[aria-pressed="true"] { background: var(--teal, #0f6e66); border-color: var(--teal, #0f6e66); color: #fff; }
.fx-try { display: flex; flex-wrap: wrap; gap: 4px; }
.fx-row input[type=range] { width: 100%; accent-color: var(--teal, #0f6e66); }

<style>
/* src/net/net.css */
/* 联机（主持人页、玩家页共用）。
 * 青绿＝在线、已送达；橙＝连接中、等待；红只用于已停止。状态都有文字，不只靠颜色。 */

.chip.info { background: #e6eef6; color: #2c4058; }
.chip.warn { background: var(--orange-soft); color: #8a3f08; }

/* ---------- 顶栏小标签 ---------- */
.net-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; line-height: 1.4; }
.net-chip:hover { border-color: var(--teal); }
.net-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
.net-chip.st-online { border-color: #b4dbd2; background: var(--teal-soft); color: var(--teal-strong); }
.net-chip.st-online .net-dot { background: var(--teal); }
.net-chip.st-connecting .net-dot, .net-chip.st-reconnecting .net-dot, .net-chip.st-lobby .net-dot { background: var(--orange); }
.net-chip.st-reconnecting { border-color: #eccaa6; background: var(--orange-soft); color: #8a3f08; }
.net-chip.st-stopped .net-dot { background: var(--red); }
@media (max-width: 519px) {
  .p-top-tools .net-chip { padding: 3px 7px; gap: 4px; }
  .p-top-tools .net-chip-text { display: none; }
}
.net-unread { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--orange); color: #fff; font-size: 12px; line-height: 18px; text-align: center; }

/* ---------- 房间、二维码 ---------- */
.net-join { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.net-join > .grow { flex: 1 1 260px; min-width: 0; }
.net-qr { flex: 0 0 auto; line-height: 0; }
.net-qr svg { display: block; max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.net-code { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: 0.18em; color: var(--ink); line-height: 1.2; }
.net-code-input { font-family: var(--mono); font-size: 20px; letter-spacing: 0.12em; text-transform: uppercase; width: 9em; }
.net-guests { margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; background: var(--orange-soft); border: 1px solid #eccaa6; }

.net-guest { align-items: center; }
.net-feed > li { font-size: 14px; padding: 6px 0; }
.net-vote ul { margin: 8px 0; }
.net-vote-stage { margin: 10px 0 0; font-weight: 650; color: var(--teal-strong); }
.net-stage-join { text-align: center; }
.net-stage-join .net-qr svg { margin: 0 auto; }
.net-stage-join .net-code { margin-top: 8px; }

/* ---------- 玩家页：加入 ---------- */
.net-roster { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.net-name { min-height: 44px; }
.net-wait { font-size: 17px; font-weight: 650; color: #8a3f08; }

/* ---------- 玩家页：现场 ---------- */
.pn-live { display: flex; flex-direction: column; gap: 12px; }
.pn-live > .card-head { margin-bottom: 0; }
.pn-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pn-phase { font-size: 19px; font-weight: 700; }
.pn-timer { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 20px; font-weight: 700; padding: 2px 10px; border-radius: 8px; background: var(--surface-2); font-variant-numeric: tabular-nums; }
.pn-timer.running { background: var(--teal-soft); color: var(--teal-strong); }
.pn-turn { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }
.pn-turn.me { background: var(--teal-soft); border: 1px solid #b4dbd2; }
.pn-turn.me b { font-size: 17px; color: var(--teal-strong); }
.pn-order { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; counter-reset: pn; }
.pn-order li { counter-increment: pn; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.pn-order li::before { content: counter(pn) ". "; color: var(--muted); }
.pn-order li.done { color: var(--muted); }
.pn-order li.current { background: var(--teal); border-color: var(--teal); color: #fff; }
.pn-order li.current::before { color: rgba(255, 255, 255, 0.8); }
.pn-order li.me { font-weight: 700; }
.pn-offer { padding: 12px; border-radius: 8px; border: 2px solid var(--teal); background: var(--teal-soft); }
.pn-offer p { margin: 4px 0 8px; }
.pn-items { display: flex; flex-wrap: wrap; gap: 8px; }
.pn-items .btn { min-height: 44px; }
.pn-event { padding: 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.pn-event p { margin: 6px 0; }
.pn-vote-btns { display: flex; flex-direction: column; gap: 8px; }
.pn-vote-btn { justify-content: flex-start; text-align: left; min-height: 44px; width: 100%; }
.pn-count { margin-left: auto; padding-left: 10px; font-weight: 600; }
.pn-rescue { font-size: 15px; }
.pn-seats { display: inline-flex; flex-wrap: wrap; gap: 4px 10px; }
.pn-seat.me { font-weight: 700; color: var(--teal-strong); }
.pn-feed { margin: 0; padding-left: 18px; font-size: 14.5px; }
.pn-feed li + li { margin-top: 4px; }
.pn-batches > li { padding: 6px 0; font-size: 14.5px; }

/* ---------- 玩家页：收件箱 ---------- */
.pn-msg { display: flex; flex-direction: column; gap: 4px; }
.pn-msg-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pn-msg-meta .chip { margin-left: 0; }
.pn-msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
</style>

/*
 * 避难所 Playtest · 界面语言（中文／English）
 *
 * 只翻译「显示出来的文字」：ui.js 的 h() 在生成文本节点和提示属性时调用 T()。

 *
 * 翻译顺序：整句精确匹配 → 固定句式（如「第 2 天」）→ 按词条从长到短逐段替换（拼接出来的句子也能翻）→ 全角标点换成半角。

 */

  if (typeof module === 'object' && module.exports) module.exports = factory(root);
  else root.ShelterI18n = factory(root);
})(typeof self !== 'undefined' ? self : this, function (root) {
  'use strict';

  var KEY_LANG = 'shelter-playtest:lang';
  var HAN = /[一-鿿]/;
  var dict = root.SHELTER_I18N_EN || {};
  var lang = readLang();
  var cache = {};
  var index = null;

  function readLang() {
    try { return root.localStorage && root.localStorage.getItem(KEY_LANG) === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; }
  }

  function setLang(next) {
    lang = next === 'en' ? 'en' : 'zh';
    try { root.localStorage.setItem(KEY_LANG, lang); } catch (e) { /* 本地存储不可用时只在本页生效 */ }

  var PRE = [
    [/第\s*(\d+)\s*天夜间/g, ' Night of Day $1 '],
    [/第\s*(\d+)\s*天/g, ' Day $1 '],
    [/第\s*(\d+)\s*夜/g, ' Night $1 '],
    [/第\s*(\d+)\s*轮/g, ' Round $1 '],
    [/第\s*(\d+)\s*座/g, ' Seat $1 '],
    [/第\s*(\d+)\s*次/g, ' #$1 '],
    [/第\s*(\d+)\s*份/g, ' List $1 '],
    [/第\s*(\d+)\s*件/g, ' Item $1 '],
    [/第\s*(\d+)\s*张/g, ' Card $1 ']

    [/(\d+(?:\.\d+)?)\s*单位/g, '$1 units'],
    [/(\d+)\s*件/g, '$1 pcs'],
    [/(\d+(?:\.\d+)?)\s*秒/g, '$1s'],
    [/(\d+)\s*分钟/g, '$1 min'],
    [/(\d+)\s*人/g, '$1 players'],
    [/(\d+)\s*条/g, '$1'],
    [/(\d+)\s*项/g, '$1 items'],
    [/(\d+)\s*次/g, '$1×'],
    [/(\d+)\s*份/g, '$1'],
    [/(\d+)\s*个/g, '$1'],
    [/(\d+)\s*轮/g, '$1 rounds'],
    [/(\d+)\s*回合/g, '$1 turns'],
    [/(\d+)\s*分/g, '$1 pts']
  ];

  var PUNCT = [
    [/：/g, ': '], [/，/g, ', '], [/。/g, '. '], [/；/g, '; '], [/、/g, ', '], [/！/g, '! '], [/？/g, '? '],
    [/（/g, ' ('], [/）/g, ') '], [/「/g, '“'], [/」/g, '”'], [/『/g, '“'], [/』/g, '”'], [/／/g, '/'], [/～/g, '–'],
    [/【/g, '['], [/】/g, '] '], [/ {2,}/g, ' '], [/ ([,.;:!?)\]])/g, '$1'], [/\( /g, '('], [/\[ /g, '['], [/“ /g, '“'], [/ ”/g, '”']
  ];

  /* 按首字符分桶、桶内从长到短，逐位置找最长词条 */
  function buildIndex() {
    index = {};
    Object.keys(dict).forEach(function (k) {
      if (!k) return;
      (index[k[0]] = index[k[0]] || []).push(k);
    });
    Object.keys(index).forEach(function (c) { index[c].sort(function (a, b) { return b.length - a.length; }); });

    if (!index) buildIndex();
    var out = '';
    var i = 0;
    while (i < s.length) {
      var bucket = index[s[i]];
      var hit = null;
      if (bucket) {
        for (var j = 0; j < bucket.length; j++) {

    if (lang !== 'en') return s;
    var k = context + '|' + s;
    return Object.prototype.hasOwnProperty.call(dict, k) ? dict[k] : T(s);

    T: T,
    TC: TC,
    setLang: setLang,
    getLang: function () { return lang; },
    isEn: function () { return lang === 'en'; },
    _setDict: function (d) { dict = d || {}; index = null; cache = {}; },
    KEY_LANG: KEY_LANG
  };
});
