<style>
/* src/shared/base.css */
/* 避难所 Playtest · 共享样式
 * 暖白底；青绿＝资源与进程；橙＝风险；红只用于严重警告。
 * 状态一律同时显示文字与数值，不只靠颜色。字体只用系统字体，不加载远程资源。 */

:root {
  --bg: #faf6ee;
  --surface: #fffdf8;
  --surface-2: #f4efe4;
  --surface-3: #ece5d6;
  --ink: #2a2620;
  --ink-2: #57504a;
  --muted: #847b70;
  --line: #e3dacb;
  --line-strong: #cfc4b1;
  --teal: #0f6e66;
  --teal-strong: #0b5a53;
  --teal-soft: #dcefe9;
  --orange: #b4540e;
  --orange-soft: #fbe9d6;
  --red: #b42318;
  --red-soft: #fde5e1;
  --violet: #5b4a8a;
  --violet-soft: #ebe6f6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(60, 40, 10, 0.06), 0 4px 14px rgba(60, 40, 10, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 650; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
h4 { font-size: 15px; }
p { margin: 0 0 8px; }
ul, ol { margin: 0; padding-left: 20px; }
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
.offscreen { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.hidden { display: none !important; }
.grow { flex: 1 1 auto; min-width: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.icon { display: inline-flex; vertical-align: -2px; }
.icon svg { display: block; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }
.grid2 > .card, .grid3 > .card, .stack > .card { margin-top: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: 8px; }
.card.inset { background: var(--surface-2); box-shadow: none; }
.section-note { color: var(--muted); font-size: 13px; margin-top: -4px; margin-bottom: 10px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;

  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }

/* ---------- 表单 ---------- */
input[type="text"], input[type="number"], input:not([type]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fff;
  padding: 7px 10px;
  min-height: 36px;
  max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input.num { width: 84px; text-align: center; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(15, 110, 102, 0.35); border-color: var(--teal); }

.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.stepper { display: inline-flex; gap: 4px; align-items: center; }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; }
.seg:last-child { border-right: 0; }
.seg.on { background: var(--teal); color: #fff; font-weight: 600; }

/* ---------- 标签 ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.badge.rule-confirmed { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.badge.rule-tentative { background: #fff5d6; border-color: #ecd68f; color: #7a5c00; }
.badge.rule-pending { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.rule-impl { background: #e7eef8; border-color: #c4d4ea; color: #2c4f7c; }
.badge.rule-draft { background: var(--violet-soft); border-color: #d2c8ec; color: var(--violet); }
.badge.rule-custom { background: var(--surface-3); }
.badge.rule-demo, .badge.demo { background: #fff0c2; border-color: #e7c55c; color: #6b5100; }
.badge.risk { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }
.badge.ok { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.pending-tag { display: inline-block; font-size: 13px; color: var(--orange); background: var(--orange-soft); border: 1px dashed #e2b585; border-radius: 6px; padding: 1px 7px; }

.callout { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.callout.risk { background: var(--orange-soft); border-color: #eccaa6; color: #6a3205; }
.callout.danger { background: var(--red-soft); border-color: #f0b4ab; color: #7a1610; }
.callout.ok { background: var(--teal-soft); border-color: #b4dbd2; color: #0b4a44; }
.callout.info { background: #eef3f8; border-color: #cfdcea; color: #2c4058; }

/* ---------- 进度条（文字＋数值） ---------- */
.meter { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--teal); border-radius: 999px; }
.meter.over > span { background: var(--orange); }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th, .tbl td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.tbl tr.current td { background: var(--teal-soft); }
.tbl tr.done td { color: var(--muted); }

.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain > li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-plain > li:last-child { border-bottom: 0; }

/* ---------- 复制交接文本 ---------- */
.copy-block { display: flex; flex-direction: column; gap: 6px; }
.copy-text { font-size: 14px; background: #fffef9; font-family: var(--font); }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- 弹窗与提示 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(42, 32, 20, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 18px 50px rgba(30, 20, 0, 0.25); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal.wide { width: min(760px, 100%); }
.modal-title { font-size: 18px; }
.modal-body { display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(92vw, 420px); pointer-events: none; }
.toast { background: #2f2a24; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); transition: opacity 0.4s, transform 0.4s; }
.toast.ok { background: var(--teal-strong); }
.toast.warn { background: #8a4210; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ---------- 横幅 ---------- */
.banner { padding: 8px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.banner.demo { background: #fff0c2; color: #5a4300; }
.banner.danger { background: var(--red-soft); color: #7a1610; }
.banner.risk { background: var(--orange-soft); color: #6a3205; }
.banner.info { background: #eef3f8; color: #2c4058; }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.tab { border: 0; background: none; padding: 11px 13px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
.tab.on { color: var(--teal-strong); border-bottom-color: var(--teal); font-weight: 650; }

.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ---------- 秘密遮挡：内容根本不渲染，只显示这张卡 ---------- */
.gate { text-align: center; padding: 26px 16px; border-style: dashed; background: var(--surface-2); }
.gate h3 { margin: 6px 0; justify-content: center; }
.gate .gate-icon { color: var(--muted); }
.gate .gate-icon .icon svg { width: 28px; height: 28px; }
.reveal-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; background: var(--orange-soft); border: 1px solid #eccaa6; color: #6a3205; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }

@media (max-width: 640px) {
  /* 英文按钮文字较长：窄屏上允许换行，而不是把页面撑宽 */
  .btn { white-space: normal; max-width: 100%; text-align: center; }
  .btn.small, .btn.icon-btn, .lang-btn { white-space: nowrap; }
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 13px; }
}

/* ---------- 仪表盘部件：指标卡、状态徽章（图标＋文字＋颜色）、同色相进度条 ---------- */
.tile {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow);
  font: inherit; color: inherit;
}
.tile:hover { border-color: var(--line-strong); }
.tile:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.tile-label { font-size: 13.5px; color: var(--ink-2); }
.tile-value { font-size: 24px; font-weight: 650; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.tile-unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile-sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; }

/* 状态徽章：图标形状 + 文字 + 颜色 */
.sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; line-height: 1; padding: 4px 8px 4px 6px; border-radius: 999px; white-space: nowrap; }
.sev .icon svg { width: 14px; height: 14px; }
.sev-ok { background: var(--teal-soft); color: var(--teal-strong); }
.sev-info { background: var(--surface-2); color: var(--ink-2); }
.sev-warn { background: var(--orange-soft); color: #8a3f08; }
.sev-crit { background: var(--red-soft); color: var(--red); }

/* 进度条：同一色相，轨道取浅色阶 */
.meter2 { display: block; height: 8px; border-radius: 4px; overflow: hidden; }
.meter2-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.m-ok { background: var(--teal-soft); } .m-ok .meter2-fill { background: var(--teal); }
.m-warn { background: var(--orange-soft); } .m-warn .meter2-fill { background: var(--orange); }
.m-crit { background: var(--red-soft); } .m-crit .meter2-fill { background: var(--red); }
.m-info { background: var(--surface-3); } .m-info .meter2-fill { background: var(--muted); }

/* ---------- 语言切换 ---------- */
.lang-btn { min-width: 44px; font-weight: 650; letter-spacing: 0.02em; white-space: nowrap; flex: 0 0 auto; }
</style>
<style>
/* src/host/host.css */
/* 主持人端：桌面优先（主持台＋屏幕共享），平板与手机也能用。
 * 版面逻辑：顶栏＝每页都要的进度与操作；标签按「可共享 → 秘密 → 设置」分组；
 * 主持台＝阶段轨 + 当前阶段（主区）+ 待办／概况（侧栏）；公开展示＝阶段（最大字）+ 轮到谁 + 计时与营救。 */

body.host { min-width: 320px; }
.tile-value, .rescue-big, .rescue-value, .timer-display, .stat-value { font-variant-numeric: tabular-nums; }

/* ---------- 顶栏 ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-main { display: flex; align-items: center; gap: 8px 18px; padding: 8px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; white-space: nowrap; font-size: 16px; }
.brand-role { font-size: 12.5px; color: var(--ink-2); padding: 1px 8px; border: 1px solid var(--line-strong); border-radius: 999px; }
.top-stats { display: flex; gap: 2px; align-items: center; flex: 1 1 auto; min-width: 0; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; padding: 1px 12px; border-left: 1px solid var(--line); line-height: 1.25; }
.stat:first-child { border-left: 0; padding-left: 0; }
.stat-label { font-size: 12px; color: var(--muted); }
.stat-value { font-size: 15px; font-weight: 650; white-space: nowrap; }
.stat.teal .stat-value { color: var(--teal-strong); }
.cfg-chip { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; padding: 3px 10px; border-radius: 999px; border: 1px solid #eccaa6; background: var(--orange-soft); color: #8a3f08; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.cfg-chip .icon svg { width: 14px; height: 14px; }
.cfg-chip:hover { border-color: var(--orange); }
.top-actions { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; }
.top-group { display: inline-flex; gap: 6px; }

/* ---------- 标签分组 ---------- */
.tab-group { display: flex; align-items: stretch; gap: 2px; flex: 0 0 auto; }
.tab-group + .tab-group { margin-left: 8px; padding-left: 8px; position: relative; }
.tab-group + .tab-group::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; border-left: 1px solid var(--line-strong); }
.tab-group-label { align-self: center; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; color: #8a3f08; background: var(--orange-soft); border-radius: 999px; padding: 2px 8px 2px 6px; margin-right: 4px; white-space: nowrap; }
.tab-group-label .icon svg { width: 12px; height: 12px; }

.main { max-width: 1280px; margin: 0 auto; padding: 16px 16px 80px; }

/* ---------- 主持台 ---------- */
.console { display: flex; flex-direction: column; gap: 14px; }
.console-cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
.console-main, .console-side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.console .card + .card, .console-side > * { margin-top: 0; }
.side-card { padding: 14px; }
.side-card .card-head { margin-bottom: 8px; }
.side-card h2 { font-size: 16px; }

/* 阶段轨：圆点＋连线，做完的打勾，当前的实心并带光圈 */
.rail-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 10px 8px; box-shadow: var(--shadow); }
.rail { list-style: none; margin: 0; padding: 0; display: flex; overflow-x: auto; scrollbar-width: thin; }
.rail-step { flex: 1 1 0; min-width: 86px; position: relative; }
.rail-step::before { content: ""; position: absolute; top: 15px; left: -50%; right: 50%; height: 2px; background: var(--line-strong); }
.rail-step:first-child::before { display: none; }
.rail-step.done::before, .rail-step.on::before { background: var(--teal); }
.rail-step button { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 100%; background: none; border: 0; padding: 0 2px 4px; cursor: pointer; color: var(--ink-2); border-radius: 8px; }
.rail-step button:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); }
.rail-no { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; background: var(--surface); border: 2px solid var(--line-strong); color: var(--muted); }
.rail-step.done .rail-no { background: var(--teal-soft); border-color: var(--teal); color: var(--teal-strong); }
.rail-step.on .rail-no { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 0 0 4px var(--teal-soft); }
.rail-step button:hover .rail-no { border-color: var(--teal); }
.rail-name { font-size: 13.5px; white-space: nowrap; }
.rail-step.todo .rail-name { color: var(--muted); }
.rail-step.on .rail-name { color: var(--teal-strong); font-weight: 700; }
.rail-note { display: flex; justify-content: space-between; gap: 2px 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); margin: 6px 6px 0; }

/* 当前阶段：主持台唯一带色边的卡 */
.current-phase { border-left: 4px solid var(--teal); padding: 16px 20px; scroll-margin-top: 140px; }
.phase-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px 24px; flex-wrap: wrap; margin-bottom: 6px; }
.phase-kicker { display: block; font-size: 13px; color: var(--muted); }
.phase-title h2 { font-size: 24px; }
.phase-prog { display: flex; flex-direction: column; gap: 6px; flex: 0 1 260px; min-width: 180px; }
.phase-prog-text { font-size: 14px; font-weight: 650; color: var(--ink-2); }
.phase-foot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line-strong); flex-wrap: wrap; }
#seats-card { scroll-margin-top: 140px; }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 4px rgba(15, 110, 102, 0.4); } to { box-shadow: var(--shadow); } }

/* 待办：徽章（图标＋文字＋颜色）｜说明｜去处理 */
.todo-list { list-style: none; margin: 0; padding: 0; }
.todo-item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.todo-item:first-child { border-top: 0; padding-top: 0; }
.todo-text { font-size: 14px; line-height: 1.45; padding-top: 1px; }
.todo-go { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; white-space: nowrap; padding-top: 2px; }
.todo-go .icon svg { width: 12px; height: 12px; }

.tiles-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tiles-2 .tile { padding: 10px 12px; }
.tiles-2 .tile-sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.rescue-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.rescue-big { font-size: 36px; font-weight: 700; color: var(--teal-strong); line-height: 1; }
.rescue-of { font-size: 15px; font-weight: 500; color: var(--muted); margin-left: 4px; }
.rescue-card .meter2 { margin-bottom: 6px; }

.seat-edit { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px 18px; }
.seat-edit li { display: flex; gap: 6px; align-items: center; padding: 3px 0; }
.checklist { list-style: none; padding: 0; }
.checklist li::before { content: "○ "; color: var(--muted); }
.checklist li.ok::before { content: "✓ "; color: var(--teal); font-weight: 700; }
.guide summary { cursor: pointer; }
.guide ol { margin-top: 8px; font-size: 14px; }

/* ---------- 计时（主持台小号，公开展示大号） ---------- */
.timer { display: flex; flex-direction: column; gap: 8px; }
.timer.big { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; box-shadow: var(--shadow); }
.timer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.stage-label { font-size: 14px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.timer-state { font-size: 12.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); }
.timer-state.run { background: var(--teal-soft); color: var(--teal-strong); }
.timer-state.done { background: var(--orange-soft); color: #8a3f08; }
.timer-display { font-family: var(--mono); font-size: 56px; font-weight: 700; letter-spacing: 2px; line-height: 1; color: var(--teal-strong); }
.timer.compact .timer-display { font-size: 38px; }
.timer-display.done { color: var(--orange); }

/* ---------- 公开展示 ---------- */
.stage { display: flex; flex-direction: column; gap: 16px; }
.stage-hero { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 26px 18px; box-shadow: var(--shadow); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero-day { font-size: 18px; font-weight: 650; color: var(--ink-2); }
.hero-phase { display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; font-size: 54px; line-height: 1.1; font-weight: 750; letter-spacing: 0.02em; margin: 4px 0 6px; }
.hero-no { font-size: 24px; font-weight: 650; color: var(--teal-strong); letter-spacing: 0; }
.hero-desc { font-size: 17px; color: var(--ink-2); max-width: 46em; margin: 0 0 16px; }

/* 阶段条：一段一个阶段，做完的浅青、当前的深青加粗、未到的只有轨道 */
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; }
.track-seg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.track-bar { height: 6px; margin-top: 2px; border-radius: 3px; background: var(--surface-3); }
.track-seg.done .track-bar { background: #8fc4bb; }
.track-seg.on .track-bar { height: 10px; margin-top: 0; background: var(--teal); }
.track-label { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.track-seg.done .track-label { color: var(--ink-2); }
.track-seg.on .track-label { color: var(--teal-strong); font-weight: 700; font-size: 15px; }

.stage-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.stage-focus, .stage-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.stage-more { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.stage-panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; box-shadow: var(--shadow); min-width: 0; }
.stage-panel h3 { margin-bottom: 10px; color: var(--ink-2); font-size: 15px; }
.stage-panel.focus { padding: 20px 24px; }
.focus-now { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; margin-bottom: 14px; }
.focus-label { font-size: 20px; color: var(--ink-2); }
.focus-name { font-size: 46px; font-weight: 750; color: var(--teal-strong); line-height: 1.1; }
.focus-count { font-size: 15px; color: var(--muted); margin-left: auto; }
.supply-batch + .supply-batch { margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }

.seat-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px 14px; }
.seat { display: flex; align-items: center; gap: 8px; font-size: 20px; flex-wrap: wrap; }
.seat.dead .seat-name { color: var(--muted); }
.seat-no { display: inline-flex; width: 30px; height: 30px; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface-3); font-weight: 700; font-size: 15px; flex: 0 0 auto; }
.seat-name { font-weight: 600; }

.chip { display: inline-flex; align-items: center; font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); margin-left: 4px; font-weight: 600; white-space: nowrap; }
.chip.ok { background: var(--teal-soft); color: var(--teal-strong); }
.chip.now { background: var(--teal); color: #fff; }
.chip.danger { background: var(--red-soft); color: var(--red); }
.chip.demo { background: #fff0c2; color: #6b5100; }

.order-line { list-style: none; padding: 0; margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.order-item { padding: 5px 12px; border-radius: 8px; background: var(--surface-2); font-size: 17px; }
.order-item.done { color: var(--teal-strong); background: var(--teal-soft); }
.order-item.now { background: var(--teal); color: #fff; font-weight: 650; }

.stage-event .event-title { font-size: 24px; font-weight: 700; display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.event-loc { font-size: 15px; font-weight: 500; color: var(--muted); }
.stage-event .event-body { font-size: 17px; margin-top: 6px; }
.event-check { font-size: 18px; }
.vote-options { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.vote-option { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 10px; border: 1px solid var(--line-strong); font-size: 17px; font-weight: 600; background: var(--surface); }
.vote-option b { display: inline-flex; width: 26px; height: 26px; align-items: center; justify-content: center; border-radius: 6px; background: var(--teal); color: #fff; font-size: 14px; }

.rescue-value { font-size: 46px; font-weight: 750; color: var(--teal-strong); line-height: 1.1; }
.rescue-value .rescue-of { font-size: 20px; }
.rescue-panel .meter2 { margin: 8px 0; height: 10px; border-radius: 5px; }

.feed { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.feed li { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); }
.feed li.today { background: var(--teal-soft); }
.feed-meta { font-size: 12.5px; color: var(--muted); }
.feed-text { font-size: 16.5px; }

/* 全屏展示：只留公开展示页，字号放大，适合 Discord 屏幕共享 */
body.presenting #banner, body.presenting .topbar, body.presenting .tabs { display: none; }
body.presenting .main { max-width: none; padding: 24px clamp(16px, 4vw, 56px) 40px; }
body.presenting .hero-phase { font-size: clamp(44px, 6vw, 96px); }
body.presenting .hero-no { font-size: clamp(22px, 2.4vw, 36px); }
body.presenting .hero-desc { font-size: clamp(17px, 1.5vw, 22px); }
body.presenting .focus-name { font-size: clamp(40px, 4.6vw, 76px); }
body.presenting .seat { font-size: clamp(20px, 1.8vw, 28px); }
body.presenting .feed-text, body.presenting .order-item { font-size: clamp(17px, 1.4vw, 21px); }
body.presenting .timer-display { font-size: clamp(56px, 5vw, 84px); }
body.presenting .present-btn { opacity: 0.6; }
body.presenting .present-btn:hover, body.presenting .present-btn:focus-visible { opacity: 1; }

.risk-text { color: var(--orange); }
.ok-text { color: var(--teal-strong); }

/* ---------- 秘密区 ---------- */
.pool-cat h4 { margin: 10px 0 2px; color: var(--ink-2); }
.add-row { margin: 10px 0; }
.weights { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.weight { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); padding: 4px 8px; border-radius: 8px; }
.batch + .batch, .card.inset + .card.inset { margin-top: 12px; }
.cands { margin: 6px 0; }
.tpl .row { align-items: flex-end; }

.flow-steps { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.flow-step { display: flex; gap: 12px; align-items: flex-start; }
.flow-no { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--teal); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
.flow-title { font-weight: 650; margin-bottom: 4px; }

.event-editor .outcome { border-top: 1px dashed var(--line-strong); padding-top: 10px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.event-editor details summary { cursor: pointer; color: var(--teal-strong); margin: 4px 0; }
pre.code { background: var(--surface-2); padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12.5px; }

.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px 18px; margin-bottom: 14px; }
.rule-row { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.rule-label { font-size: 14px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.log-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.log-list li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.log-list li.secret { background: #fff8ee; }
.log-meta { color: var(--muted); font-size: 12.5px; margin-right: 6px; }

.tbl.scores input.num { width: 64px; }
.plain-ol { list-style: none; padding-left: 0; }

/* ---------- 平板：一列，主持台按「待办 → 当前阶段 → 概况 → 其余」排；公开展示侧栏变横排 ---------- */
@media (max-width: 1023px) {
  .console-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
  .console-main, .console-side { display: contents; }
  .console-main > *, .console-side > * { grid-column: 1 / -1; }
  .console-side > .rescue-card, .console-side > .timer-card { grid-column: auto; }
  .console-side > .todo { order: 1; }
  .console-main > .current-phase { order: 2; }
  .console-side > .tiles-2 { order: 3; }
  .console-side > .rescue-card { order: 4; }
  .console-side > .timer-card { order: 5; }
  .console-main > #seats-card { order: 6; }
  .console-main > .announce-card { order: 7; }
  .console-side > .guide { order: 8; }
  .stage-grid { grid-template-columns: minmax(0, 1fr); }
  .stage-side { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .hero-phase { font-size: 44px; }
}

/* ---------- 手机 ---------- */
@media (max-width: 719px) {
  .main { padding: 12px 12px 72px; }
  .topbar { position: static; }
  .top-main { padding: 8px 12px; gap: 6px 10px; }
  .brand { font-size: 15px; }
  .top-stats { order: 3; flex: 1 1 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .stat { padding: 0 10px; }
  .stat-value { font-size: 14px; }
  .top-actions { order: 2; flex: 1 1 100%; gap: 6px; }
  .top-actions .btn { min-height: 34px; padding: 5px 10px; font-size: 14px; }
  .tab-group-label { display: none; }
  .console-cols { grid-template-columns: minmax(0, 1fr); }
  .console-side > .rescue-card, .console-side > .timer-card { grid-column: 1 / -1; }
  .rail-step { min-width: 0; }
  .rail-step.on { flex-grow: 2.4; }
  .rail-step .rail-name { display: none; }
  .rail-step.on .rail-name { display: inline; font-size: 13px; }
  .actions-tbl thead { display: none; }
  .actions-tbl tr { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; grid-template-areas: "no name state" "no rec rec" "no ops ops"; gap: 2px 8px; padding: 10px 6px; border-bottom: 1px solid var(--line); }
  .actions-tbl td { border: 0; padding: 0; }
  .actions-tbl .c-no { grid-area: no; color: var(--muted); }
  .actions-tbl .c-name { grid-area: name; font-weight: 650; }
  .actions-tbl .c-state { grid-area: state; font-size: 13.5px; }
  .actions-tbl .c-rec { grid-area: rec; font-size: 13.5px; color: var(--ink-2); }
  .actions-tbl .c-seat { display: none; }
  .actions-tbl .c-ops { grid-area: ops; padding-top: 4px; }
  .actions-tbl tr.current { background: var(--teal-soft); border-radius: 8px; }
  .actions-tbl tr.current td { background: none; }
  .rail-note span:last-child { display: none; }
  .current-phase { padding: 14px; }
  .phase-title h2 { font-size: 20px; }
  .phase-prog { flex: 1 1 100%; }
  .seat-edit { grid-template-columns: minmax(0, 1fr); }
  .stage-hero { padding: 14px 16px; }
  .hero-phase { font-size: 34px; }
  .hero-no { font-size: 18px; }
  .hero-desc { font-size: 15px; }
  .track-name { display: none; }
  .track-seg.on { grid-column: span 2; }
  .track-seg.on .track-name { display: inline; }
  .stage-panel, .stage-panel.focus { padding: 14px 16px; }
  .focus-name { font-size: 32px; }
  .focus-label { font-size: 17px; }
  .seat { font-size: 17px; }
  .timer-display { font-size: 44px; }
  .rescue-value { font-size: 38px; }
  .stage-more { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .flash { animation: none; }
}

<script>
/* src/shared/i18n.js */
/*
 * 避难所 Playtest · 界面语言（中文／English）
 *
 * 只翻译「显示出来的文字」：ui.js 的 h() 在生成文本节点和提示属性时调用 T()。
 * 游戏数据（存档里的状态值、日志、名字）保持原样，所以中英文切换不影响存档，也不影响规则判断。
 *
 * 翻译顺序：整句精确匹配 → 固定句式（如「第 2 天」）→ 按词条从长到短逐段替换（拼接出来的句子也能翻）→ 全角标点换成半角。
 * 词典来自 src/shared/i18n/*.tsv，由 build.mjs 内联为 SHELTER_I18N_EN。
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(root);
  else root.ShelterI18n = factory(root);
})(typeof self !== 'undefined' ? self : this, function (root) {
  'use strict';

  var KEY_LANG = 'shelter-playtest:lang';
  var HAN = /[一-鿿]/;
  var dict = root.SHELTER_I18N_EN || {};
  var lang = readLang();
  var cache = {};
  var index = null;

  function readLang() {
    try { return root.localStorage && root.localStorage.getItem(KEY_LANG) === 'en' ? 'en' : 'zh'; } catch (e) { return 'zh'; }
  }

  function setLang(next) {
    lang = next === 'en' ? 'en' : 'zh';
    try { root.localStorage.setItem(KEY_LANG, lang); } catch (e) { /* 本地存储不可用时只在本页生效 */ }
    if (root.document) root.document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
  }

  /* 固定句式：语序与中文不同、靠逐段替换拼不出来的（先于词条替换） */
  var PRE = [
    [/第\s*(\d+)\s*天夜间/g, ' Night of Day $1 '],
    [/第\s*(\d+)\s*天/g, ' Day $1 '],
    [/第\s*(\d+)\s*夜/g, ' Night $1 '],
    [/第\s*(\d+)\s*轮/g, ' Round $1 '],
    [/第\s*(\d+)\s*座/g, ' Seat $1 '],
    [/第\s*(\d+)\s*次/g, ' #$1 '],
    [/第\s*(\d+)\s*份/g, ' List $1 '],
    [/第\s*(\d+)\s*件/g, ' Item $1 ']
  ];
  /* 量词兜底：词条替换后还剩下的「数字＋量词」 */
  var POST = [
    [/(\d+(?:\.\d+)?)\s*单位/g, '$1 units'],
    [/(\d+)\s*件/g, '$1 pcs'],
    [/(\d+(?:\.\d+)?)\s*秒/g, '$1s'],
    [/(\d+)\s*分钟/g, '$1 min'],
    [/(\d+)\s*人/g, '$1 players'],
    [/(\d+)\s*条/g, '$1'],
    [/(\d+)\s*项/g, '$1 items'],
    [/(\d+)\s*次/g, '$1×'],
    [/(\d+)\s*份/g, '$1'],
    [/(\d+)\s*个/g, '$1'],
    [/(\d+)\s*轮/g, '$1 rounds'],
    [/(\d+)\s*回合/g, '$1 turns'],
    [/(\d+)\s*分/g, '$1 pts']
  ];

  var PUNCT = [
    [/：/g, ': '], [/，/g, ', '], [/。/g, '. '], [/；/g, '; '], [/、/g, ', '], [/！/g, '! '], [/？/g, '? '],
    [/（/g, ' ('], [/）/g, ') '], [/「/g, '“'], [/」/g, '”'], [/『/g, '“'], [/』/g, '”'], [/／/g, '/'], [/～/g, '–'],
    [/【/g, '['], [/】/g, '] '], [/ {2,}/g, ' '], [/ ([,.;:!?)])/g, '$1'], [/\( /g, '('], [/“ /g, '“'], [/ ”/g, '”']
  ];

  /* 按首字符分桶、桶内从长到短，逐位置找最长词条 */
  function buildIndex() {
    index = {};
    Object.keys(dict).forEach(function (k) {
      if (!k) return;
      (index[k[0]] = index[k[0]] || []).push(k);
    });
    Object.keys(index).forEach(function (c) { index[c].sort(function (a, b) { return b.length - a.length; }); });
  }

  function replacePhrases(s) {
    if (!index) buildIndex();
    var out = '';
    var i = 0;
    while (i < s.length) {
      var bucket = index[s[i]];
      var hit = null;
      if (bucket) {
        for (var j = 0; j < bucket.length; j++) {
          if (s.startsWith(bucket[j], i)) { hit = bucket[j]; break; }
        }
      }
      if (hit) { out += dict[hit]; i += hit.length; } else { out += s[i]; i += 1; }
    }
    return out;
  }

  function translate(s) {
    if (Object.prototype.hasOwnProperty.call(dict, s)) return dict[s];
    var lead = s.match(/^\s*/)[0];
    var trail = s.match(/\s*$/)[0];
    var core = s.trim();
    if (Object.prototype.hasOwnProperty.call(dict, core)) return lead + dict[core] + trail;
    // 词条可能带首尾空格（拼接片段），所以在未去空格的原文上替换，最后再还原首尾空白
    var out = s;
    PRE.forEach(function (r) { out = out.replace(r[0], r[1]); });
    out = replacePhrases(out);
    POST.forEach(function (r) { out = out.replace(r[0], r[1]); });
    PUNCT.forEach(function (r) { out = out.replace(r[0], r[1]); });
    return lead + out.trim() + trail;
  }

  /** 把一段要显示的中文换成当前语言。不是字符串、没有中文或当前是中文时原样返回。 */
  function T(s) {
    if (lang !== 'en' || typeof s !== 'string' || !HAN.test(s)) return s;
    if (Object.prototype.hasOwnProperty.call(cache, s)) return cache[s];
    var out = translate(s);
    cache[s] = out;
    return out;
  }

  /** 同一个中文词在不同位置意思不同时（如「口渴」既是栏目名又是状态值），按语境取词：词典里写成「语境|中文」。 */
  function TC(context, s) {
    if (lang !== 'en') return s;
    var k = context + '|' + s;
    return Object.prototype.hasOwnProperty.call(dict, k) ? dict[k] : T(s);
  }

  return {
    T: T,
    TC: TC,
    setLang: setLang,
    getLang: function () { return lang; },
    isEn: function () { return lang === 'en'; },
    _setDict: function (d) { dict = d || {}; index = null; cache = {}; },
    KEY_LANG: KEY_LANG
  };
});

    out.itemUses = Object.assign({}, base.itemUses, (rules && rules.itemUses) || {});
    // 第2版调整了搜刮节奏（5秒→7秒，约3单位→2单位）：旧存档里仍是旧默认值的才跟着改，手动改过的保留
