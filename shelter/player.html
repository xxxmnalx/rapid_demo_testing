/* src/shared/base.css */
/* 避难所 Playtest · 共享样式
 * 暖白底；青绿＝资源与进程；橙＝风险；红只用于严重警告。
 * 状态一律同时显示文字与数值，不只靠颜色。字体只用系统字体，不加载远程资源。 */

:root {
  --bg: #faf6ee;
  --surface: #fffdf8;
  --surface-2: #f4efe4;
  --surface-3: #ece5d6;
  --ink: #2a2620;
  --ink-2: #57504a;
  --muted: #847b70;
  --line: #e3dacb;
  --line-strong: #cfc4b1;
  --teal: #0f6e66;
  --teal-strong: #0b5a53;
  --teal-soft: #dcefe9;
  --orange: #b4540e;
  --orange-soft: #fbe9d6;
  --red: #b42318;
  --red-soft: #fde5e1;
  --violet: #5b4a8a;
  --violet-soft: #ebe6f6;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(60, 40, 10, 0.06), 0 4px 14px rgba(60, 40, 10, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.6;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.3; font-weight: 650; }
h2 { font-size: 20px; }
h3 { font-size: 17px; }
h4 { font-size: 15px; }
p { margin: 0 0 8px; }
ul, ol { margin: 0; padding-left: 20px; }
a { color: var(--teal); }
button, input, select, textarea { font: inherit; color: inherit; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--mono); }
.nowrap { white-space: nowrap; }
.offscreen { position: fixed; left: -9999px; top: 0; width: 1px; height: 1px; opacity: 0; }
.hidden { display: none !important; }
.grow { flex: 1 1 auto; min-width: 0; }

.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.tight { gap: 4px; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

.icon { display: inline-flex; vertical-align: -2px; }
.icon svg { display: block; }

/* ---------- 卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.card + .card { margin-top: 14px; }
.grid2 > .card, .grid3 > .card, .stack > .card { margin-top: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.card-head h2, .card-head h3 { display: flex; align-items: center; gap: 8px; }
.card.inset { background: var(--surface-2); box-shadow: none; }
.section-note { color: var(--muted); font-size: 13px; margin-top: -4px; margin-bottom: 10px; }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 36px;
  padding: 6px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--surface);
  cursor: pointer;
  font-size: 15px;
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }

.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }

.btn.risk { background: var(--orange-soft); border-color: #e7b88d; color: var(--orange); }

.btn.icon-btn { padding: 4px 8px; min-width: 34px; }
.btn-link { background: none; border: 0; padding: 0; color: var(--teal); cursor: pointer; text-decoration: underline; font-size: inherit; }

/* ---------- 表单 ---------- */
input[type="text"], input[type="number"], input:not([type]), select, textarea {
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fff;
  padding: 7px 10px;
  min-height: 36px;
  max-width: 100%;
}
textarea { width: 100%; resize: vertical; line-height: 1.5; }
input.num { width: 84px; text-align: center; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(15, 110, 102, 0.35); border-color: var(--teal); }
input[type="checkbox"], input[type="radio"] { width: 18px; height: 18px; accent-color: var(--teal); vertical-align: -3px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.field-hint { font-size: 12.5px; color: var(--muted); }
.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.stepper { display: inline-flex; gap: 4px; align-items: center; }

.segmented { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; flex-wrap: wrap; }
.seg { border: 0; border-right: 1px solid var(--line); background: var(--surface); padding: 6px 12px; min-height: 36px; cursor: pointer; }
.seg:last-child { border-right: 0; }
.seg.on { background: var(--teal); color: #fff; font-weight: 600; }

/* ---------- 标签 ---------- */
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); white-space: nowrap; font-weight: 600; }
.badge.rule-confirmed { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.badge.rule-tentative { background: #fff5d6; border-color: #ecd68f; color: #7a5c00; }
.badge.rule-pending { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.rule-impl { background: #e7eef8; border-color: #c4d4ea; color: #2c4f7c; }
.badge.rule-draft { background: var(--violet-soft); border-color: #d2c8ec; color: var(--violet); }
.badge.rule-custom { background: var(--surface-3); }
.badge.rule-demo, .badge.demo { background: #fff0c2; border-color: #e7c55c; color: #6b5100; }
.badge.risk { background: var(--orange-soft); border-color: #eccaa6; color: var(--orange); }
.badge.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }
.badge.ok { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.pending-tag { display: inline-block; font-size: 13px; color: var(--orange); background: var(--orange-soft); border: 1px dashed #e2b585; border-radius: 6px; padding: 1px 7px; }

.callout { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 14px; }
.callout.risk { background: var(--orange-soft); border-color: #eccaa6; color: #6a3205; }
.callout.danger { background: var(--red-soft); border-color: #f0b4ab; color: #7a1610; }
.callout.ok { background: var(--teal-soft); border-color: #b4dbd2; color: #0b4a44; }
.callout.info { background: #eef3f8; border-color: #cfdcea; color: #2c4058; }

/* ---------- 进度条（文字＋数值） ---------- */
.meter { position: relative; height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.meter > span { position: absolute; inset: 0 auto 0 0; background: var(--teal); border-radius: 999px; }
.meter.over > span { background: var(--orange); }

/* ---------- 表格 ---------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.tbl th, .tbl td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--ink-2); font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.tbl tr.current td { background: var(--teal-soft); }
.tbl tr.done td { color: var(--muted); }

.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain > li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.list-plain > li:last-child { border-bottom: 0; }

/* ---------- 复制交接文本 ---------- */
.copy-block { display: flex; flex-direction: column; gap: 6px; }
.copy-text { font-size: 14px; background: #fffef9; font-family: var(--font); }
.copy-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- 弹窗与提示 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(42, 32, 20, 0.45); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 12px 12px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 12px; width: min(520px, 100%); box-shadow: 0 18px 50px rgba(30, 20, 0, 0.25); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal.wide { width: min(760px, 100%); }
.modal-title { font-size: 18px; }
.modal-body { display: flex; flex-direction: column; gap: 10px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }

#toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(92vw, 420px); pointer-events: none; }
.toast { background: #2f2a24; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14.5px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); transition: opacity 0.4s, transform 0.4s; }
.toast.ok { background: var(--teal-strong); }
.toast.warn { background: #8a4210; }
.toast.out { opacity: 0; transform: translateY(6px); }

/* ---------- 横幅 ---------- */
.banner { padding: 8px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.banner.demo { background: #fff0c2; color: #5a4300; }
.banner.danger { background: var(--red-soft); color: #7a1610; }
.banner.risk { background: var(--orange-soft); color: #6a3205; }
.banner.info { background: #eef3f8; color: #2c4058; }

/* ---------- 标签页 ---------- */
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: thin; border-bottom: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
.tab { border: 0; background: none; padding: 11px 13px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; font-size: 15px; display: inline-flex; align-items: center; gap: 5px; }
.tab.on { color: var(--teal-strong); border-bottom-color: var(--teal); font-weight: 650; }

.empty { color: var(--muted); font-size: 14px; padding: 10px 0; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 14.5px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* ---------- 秘密遮挡：内容根本不渲染，只显示这张卡 ---------- */
.gate { text-align: center; padding: 26px 16px; border-style: dashed; background: var(--surface-2); }
.gate h3 { margin: 6px 0; justify-content: center; }
.gate .gate-icon { color: var(--muted); }
.gate .gate-icon .icon svg { width: 28px; height: 28px; }
.reveal-bar { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; background: var(--orange-soft); border: 1px solid #eccaa6; color: #6a3205; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }

@media (max-width: 640px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 13px; }
}
</style>
<style>
/* src/player/player.css */
/* 玩家端
 * 手机（< 720px）：顶部紧凑状态栏 + 底部导航（5 个常用页 +「更多」），单列。
 * 平板（720–1023px）：顶部一行标签，内容两列。
 * 电脑（≥ 1024px）：左侧导航栏，内容多列网格；总览为英雄数字 + 指标卡 + 两栏卡片。 */

body.player { min-width: 300px; }

/* ---------- 顶部状态栏 ---------- */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.p-top { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; max-width: 1280px; margin: 0 auto; }
.p-top-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
.p-name { font-size: 16px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-day { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; white-space: nowrap; }
.p-chips { display: flex; gap: 6px; flex-wrap: wrap; }
/* 总览页本身就在展示这些数值，顶栏不重复 */
.p-top.on-dashboard .p-chips { display: none; }
.pchip { font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.pchip.ok { background: var(--teal-soft); border-color: #b4dbd2; color: var(--teal-strong); }
.pchip.risk { background: var(--orange-soft); border-color: #eccaa6; color: #8a3f08; }
.pchip.danger { background: var(--red-soft); border-color: #f0b4ab; color: var(--red); }

/* ---------- 导航（三种布局共用同一组按钮） ---------- */
.tabs-primary, .tabs-secondary { display: contents; }
.more-btn { display: none; }
.p-main { max-width: 1280px; margin: 0 auto; padding: 16px 12px 40px; }

/* 手机：底部导航栏 */
@media (max-width: 719px) {
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: block; padding: 0 0 env(safe-area-inset-bottom); border-top: 1px solid var(--line); border-bottom: 0;
    background: var(--surface); box-shadow: 0 -2px 12px rgba(60, 40, 10, 0.06); overflow: visible;
  }
  .tabs-primary { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .tabs-primary .tab {
    justify-content: center; padding: 10px 2px 12px; border-bottom: 0; border-top: 3px solid transparent;
    font-size: 15px; min-height: 52px;
  }
  .tabs-primary .tab.on { border-top-color: var(--teal); }
  .more-btn { display: inline-flex; }
  .tabs-secondary {
    display: none; position: absolute; right: 8px; bottom: calc(100% + 8px); min-width: 168px;
    flex-direction: column; padding: 6px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow);
  }
  .tabs-secondary.open { display: flex; }
  .tabs-secondary .tab { border-bottom: 0; border-radius: 8px; padding: 12px 14px; justify-content: flex-start; }
  .tabs-secondary .tab.on { background: var(--teal-soft); }
  .p-main { padding: 12px 12px calc(96px + env(safe-area-inset-bottom)); }
  #toast { bottom: calc(76px + env(safe-area-inset-bottom)); }
}

/* 平板：顶部一行标签 */
@media (min-width: 720px) and (max-width: 1023px) {
  .tabs { position: sticky; top: var(--top-h, 0px); z-index: 15; justify-content: center; }
  .p-main > .stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 14px; }
}

/* 电脑：左侧导航栏 + 多列内容 */
@media (min-width: 1024px) {
  .p-top { flex-direction: row; align-items: center; justify-content: space-between; padding: 10px 20px; }
  .p-top-row { gap: 16px; }
  .p-shell { display: grid; grid-template-columns: 184px minmax(0, 1fr); gap: 0 24px; max-width: 1280px; margin: 0 auto; padding: 0 20px; }
  .tabs {
    position: sticky; top: calc(var(--top-h, 0px) + 16px); align-self: start; margin-top: 16px;
    flex-direction: column; gap: 2px; padding: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: visible;
  }
  .tabs .tab { justify-content: flex-start; border-bottom: 0; border-left: 3px solid transparent; border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 15.5px; }
  .tabs .tab.on { border-left-color: var(--teal); background: var(--teal-soft); }
  .tabs .tab:hover { background: var(--surface-2); }
  .p-main { max-width: none; margin: 0; padding: 16px 0 48px; }
  .p-main > .stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 16px; }
  .tab-inventory > .stack { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
}

/* 网格布局下：卡片两列，其余（提醒条、按钮行、嵌套列表）与标记为 wide 的卡片占满整行 */
@media (min-width: 720px) {
  .p-main > .stack > :not(.card), .p-main > .stack > .wide { grid-column: 1 / -1; }
  .p-main > .stack > .card { margin-top: 0; }
}

/* ---------- 总览 ---------- */
.dash { display: flex; flex-direction: column; gap: 14px; }

.vitals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow);
  font: inherit; color: inherit;
}
.tile:hover { border-color: var(--line-strong); }
.tile:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); outline-offset: 1px; }
.tile-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.tile-label { font-size: 13.5px; color: var(--ink-2); }
.tile-value { font-size: 24px; font-weight: 650; line-height: 1.2; color: var(--ink); overflow-wrap: anywhere; }
.tile-unit { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile-sub { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.tile.hero { grid-column: 1 / -1; padding: 16px 18px; }
.tile.hero .tile-value { font-size: 56px; line-height: 1; }
.tile.hero .tile-label { font-size: 15px; }

/* 状态徽章：图标形状 + 文字 + 颜色 */
.sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; line-height: 1; padding: 4px 8px 4px 6px; border-radius: 999px; white-space: nowrap; }
.sev .icon svg { width: 14px; height: 14px; }
.sev-ok { background: var(--teal-soft); color: var(--teal-strong); }
.sev-info { background: var(--surface-2); color: var(--ink-2); }
.sev-warn { background: var(--orange-soft); color: #8a3f08; }
.sev-crit { background: var(--red-soft); color: var(--red); }

/* 进度条：同一色相，轨道取浅色阶 */
.meter2 { display: block; height: 8px; border-radius: 4px; overflow: hidden; }
.meter2-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.m-ok { background: var(--teal-soft); } .m-ok .meter2-fill { background: var(--teal); }
.m-warn { background: var(--orange-soft); } .m-warn .meter2-fill { background: var(--orange); }
.m-crit { background: var(--red-soft); } .m-crit .meter2-fill { background: var(--red); }
.m-info { background: var(--surface-3); } .m-info .meter2-fill { background: var(--muted); }

.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; height: 8px; }
.steps .step { border-radius: 2px; }
.steps.m-ok, .steps.m-warn, .steps.m-crit, .steps.m-info { background: none; }
.steps.m-ok .step { background: var(--teal-soft); } .steps.m-ok .step.on { background: var(--teal); }
.steps.m-warn .step { background: var(--orange-soft); } .steps.m-warn .step.on { background: var(--orange); }
.steps.m-crit .step { background: var(--red-soft); } .steps.m-crit .step.on { background: var(--red); }

.pips { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.pip { width: 14px; height: 8px; border-radius: 2px; background: var(--teal); }
.pip-more { font-size: 12px; color: var(--muted); margin-left: 4px; }

.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.dash-cols { display: flex; flex-direction: column; gap: 14px; }
.dash-col { display: contents; }
/* 手机单列时按重要程度排序 */
.c-alerts { order: 1; } .c-today { order: 2; } .c-cond { order: 3; } .c-comp { order: 4; } .c-id { order: 5; } .c-recent { order: 6; }
.dash-card { margin-top: 0 !important; }
.dash-card .card-head { margin-bottom: 8px; }
.dash-card h2 { font-size: 17px; }
.go { gap: 4px; color: var(--teal-strong); }
.go .icon svg { width: 14px; height: 14px; }

.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.alert-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.alert-row:last-child { border-bottom: 0; padding-bottom: 0; }
.alert-text { font-size: 14.5px; line-height: 1.45; }
.all-clear { margin: 0; color: var(--ink-2); }

.facts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.facts li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; padding-bottom: 8px; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.facts li:last-child { border-bottom: 0; padding-bottom: 0; }
.facts b { flex: 0 0 auto; }
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* 单色条形图：一个系列一种颜色，数值写在条末端 */
.bars-wrap { position: relative; }
.bars { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.bar-row { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); align-items: center; gap: 8px; border-radius: 6px; }
.bar-row:focus-visible { outline: 3px solid rgba(15, 110, 102, 0.35); }
.bar-row:hover .bar, .bar-row:focus .bar { background: var(--teal-strong); }
.bar-label { text-align: right; font-size: 13.5px; color: var(--ink-2); }
/* 每行左侧一条细基线；条形从基线长出，末端 4px 圆角 */
.bar-track { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 26px; border-left: 1px solid var(--line-strong); }
.bar { display: block; height: 16px; min-width: 2px; background: var(--teal); border-radius: 0 4px 4px 0; }
.bar-value { font-size: 13.5px; white-space: nowrap; color: var(--ink); }
.bars-caption { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.viz-tip {
  position: absolute; right: 0; transform: translateY(-100%); background: var(--ink); color: #fff; font-size: 13px;
  padding: 6px 10px; border-radius: 8px; pointer-events: none; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); z-index: 2;
}
.viz-tip b { margin-right: 4px; }

.log-list.compact li { padding: 5px 0; font-size: 13.5px; }

@media (min-width: 720px) {
  .quick { display: flex; flex-wrap: wrap; }
  .vitals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .dash-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .dash-col { display: flex; flex-direction: column; gap: 14px; }
}

@media (min-width: 1024px) {
  .vitals { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .tile.hero { grid-column: span 2; grid-row: span 2; justify-content: space-between; }
  .tile.hero .tile-value { font-size: 64px; }
  .dash-cols { grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 16px; }
}

/* ---------- 其他页 ---------- */
.chip { display: inline-flex; align-items: center; font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); margin-left: 4px; font-weight: 600; white-space: nowrap; }
.chip.ok { background: var(--teal-soft); color: var(--teal-strong); }
.chip.danger { background: var(--red-soft); color: var(--red); }
.chip.demo { background: #fff0c2; color: #6b5100; }

.big-row { display: flex; align-items: center; gap: 16px; margin: 6px 0 10px; }
.big-num { font-size: 52px; font-weight: 750; line-height: 1; min-width: 70px; text-align: center; color: var(--teal-strong); }
.big-num.small-big { font-size: 38px; text-align: left; }
.danger-text { color: var(--red) !important; }
.risk-text { color: var(--orange); }
.ok-text { color: var(--teal-strong); }
.big-check { font-size: 18px; font-weight: 650; }
.big-check input { width: 24px; height: 24px; }

.filters { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0; scrollbar-width: thin; }
.filter { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 12px; white-space: nowrap; cursor: pointer; font-size: 14px; }
.filter.on { background: var(--teal); border-color: var(--teal); color: #fff; }

.item-card .item-name { font-size: 17px; font-weight: 650; }
.item-card .qty { margin-left: 6px; color: var(--teal-strong); }
.item-effect { color: var(--ink-2); margin: 6px 0 4px; }
.notes { margin: 4px 0 0; font-size: 14.5px; }
.qty { display: inline-block; min-width: 22px; text-align: center; font-weight: 700; }
.cap { font-size: 15px; }

.scav-clock { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--orange); }
.scav-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 12px; }
.scav-option { text-align: left; border: 2px solid var(--line-strong); border-radius: 12px; background: var(--surface); padding: 12px; cursor: pointer; min-height: 120px; }
.scav-option:hover, .scav-option:focus-visible { border-color: var(--teal); outline: none; }
.scav-option.default { border-color: #e7c55c; }
.scav-option-head { font-size: 20px; font-weight: 750; display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.scav-option ul { margin: 0 0 4px; padding-left: 18px; }

.weights { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.weight { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-2); padding: 4px 8px; border-radius: 8px; font-size: 14px; }
.weight input.num { width: 64px; }

.rules-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 10px 0; }
.rule-row { display: flex; flex-direction: column; gap: 4px; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.rule-label { font-size: 14px; font-weight: 600; }

.log-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.log-list li { padding: 6px 0; border-bottom: 1px solid var(--line); }
.log-meta { color: var(--muted); font-size: 12.5px; margin-right: 6px; }

details.card > summary { cursor: pointer; }

@media (max-width: 420px) {
  .btn { padding: 6px 11px; }
  .big-num { font-size: 44px; }
  .tile.hero .tile-value { font-size: 48px; }
}

<script>
/* src/shared/core.js */
/*
 * 避难所 Playtest · 共享核心
 *
 * 物品字典、职业／任务草案、规则配置默认值，以及两端共用的纯逻辑。
 * 构建时内联进 host.html 与 player.html；Node 测试直接 require 本文件。
 *
 * 约定：
 * - 这里不碰 DOM。需要随机数的函数都接受可注入的 rng，测试可复现。
 * - 容量一律用半格整数 ticks 保存：1 tick = 0.5 单位，避免把数量和容量混在一起。
 * - 规则里没确定的数值保持 null，界面显示「待配置／主持人裁定」，不悄悄补值。
 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.ShelterCore = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var SCHEMA_VERSION = 1;
  var PENDING_TEXT = '待配置／主持人裁定';

  // ---------------------------------------------------------------- 工具

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function clone(value) {
    return value === undefined ? undefined : JSON.parse(JSON.stringify(value));
  }

  function isInt(n) {
    return typeof n === 'number' && Number.isInteger(n);
  }

  function isNum(n) {
    return typeof n === 'number' && isFinite(n);
  }

  /** 可复现的伪随机数（测试用）。 */
  function seededRng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** ticks → 「3.5」这样的单位文本；null 表示待配置。 */
  function fmtUnits(ticks) {
    if (ticks == null) return '待配置';
    var u = ticks / 2;
    return Number.isInteger(u) ? String(u) : u.toFixed(1);
  }

  /** 按权重抽一个下标；权重全为 0 时返回 -1。 */
  function weightedIndex(list, weightOf, rng) {
    var total = 0;
    var weights = list.map(function (item) {
      var w = weightOf(item);
      w = isNum(w) && w > 0 ? w : 0;
      total += w;
      return w;
    });
    if (total <= 0) return -1;
    var r = (rng || Math.random)() * total;
    for (var i = 0; i < weights.length; i++) {
      if (r < weights[i]) return i;
      r -= weights[i];
    }
    for (var j = weights.length - 1; j >= 0; j--) if (weights[j] > 0) return j;
    return -1;
  }

  /** 无放回抽 n 个。 */
  function sample(list, n, rng) {
    var pool = list.slice();
    var out = [];
    while (out.length < n && pool.length) {
      var i = Math.floor((rng || Math.random)() * pool.length);
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  // ---------------------------------------------------------------- 规则标记

  var RULE_STATUS = {
    confirmed: '已确认',
    tentative: '暂定',
    pending: '待定',

   * capacityTicks：占位（1 tick = 0.5 单位）。

   * use：玩家端「使用」按钮的处理方式；没有 use 的物品不提供使用按钮。
   * pending：效果里尚未确定的部分，界面显示为待定，不推导额外规则。
   */
  var ITEMS = [

    { id: 'cream_soup', name: '奶油汤', category: 'supply', capacityTicks: 1, ruleStatus: 'confirmed',

    { id: 'energy_bar', name: '能量棒', category: 'supply', capacityTicks: 1, ruleStatus: 'confirmed',
      effectText: '使用3次，每次约等于普通食物／面包；整个实例未用完仍占0.5。', instance: 'uses', defaultUses: 3,

    { id: 'bandage', name: '绷带', category: 'medical', capacityTicks: 1, ruleStatus: 'confirmed',

    { id: 'medkit', name: '医疗箱', category: 'medical', capacityTicks: 2, ruleStatus: 'confirmed',
      effectText: '清除伤病类负面状态，并恢复2生命；不处理饥饿、口渴及脱水昏迷。', use: 'medkit', tags: ['医疗'] },
    { id: 'cash', name: '钞票', category: 'wealth', capacityTicks: 1, ruleStatus: 'confirmed',

    { id: 'painting', name: '名画', category: 'wealth', capacityTicks: 4, ruleStatus: 'confirmed',
      effectText: '每件6分。', tags: ['财富'] },
    { id: 'jewel', name: '珠宝', category: 'wealth', capacityTicks: 2, ruleStatus: 'confirmed',
      effectText: '1～5件总分依次1、4、8、11、15；0件0分，超过5件未定。', pending: ['超过5件的计分未定'], tags: ['财富'] },

      effectText: '攻击力+2；破门、清除封锁道路。', attack: 2, tags: ['武器', '破门', '清障'] },
    { id: 'rifle', name: '军用步枪', category: 'equipment', capacityTicks: 2, ruleStatus: 'confirmed',

    { id: 'ammo', name: '子弹', category: 'equipment', capacityTicks: 1, ruleStatus: 'confirmed',
      effectText: '支持步枪；部分交易事件有额外价值。每份使用次数未定。', pending: ['每份使用次数未定'], use: 'record', tags: ['弹药', '交易'] },
    { id: 'vest', name: '防弹背心', category: 'equipment', capacityTicks: 2, ruleStatus: 'confirmed',
      effectText: '防止任务中一次负面状态或生命损失；损坏时点、伤害范围待定。', instance: 'condition',
      pending: ['损坏时点待定', '伤害范围待定'], use: 'vest', tags: ['防护'] },
    { id: 'checkers', name: '跳棋', category: 'special', capacityTicks: 1, ruleStatus: 'confirmed',
      effectText: '外交、娱乐；特定售货机事件中冒充硬币，获得食物或水。', pending: ['使用次数未定'], use: 'record', tags: ['外交', '娱乐', '售货机'] },
    { id: 'map', name: '地图', category: 'special', capacityTicks: 2, ruleStatus: 'confirmed',
      effectText: '提供地点、时间与可能回报信息；降低队伍探路危险；携带参加一次任务加1笔记，每笔记1分；可能损坏。',
      instance: 'notes', pending: ['转移后笔记归属、损坏后及死亡后的地图分数由主持人裁定'], use: 'map', tags: ['探路'] },
    { id: 'canteen', name: '军用水壶', category: 'special', capacityTicks: 2, ruleStatus: 'confirmed',
      effectText: '水源或下雨条件下可获得1份水，最多储存2份。', instance: 'water', maxWater: 2,
      pending: ['内部水是否额外占容量未定', '饮用后是否生成普通水物品未定', '取水频率未定'], use: 'canteen', tags: ['补水'] },
    { id: 'liquor', name: '酒', category: 'special', capacityTicks: 1, ruleStatus: 'confirmed',
      effectText: '事件中使用：临时攻击力+2，并承担一次口渴消耗。', use: 'liquor', tags: ['事件'] },
    { id: 'flare', name: '信号枪', category: 'special', capacityTicks: 2, ruleStatus: 'confirmed',
      effectText: '适当地点与时机推进营救；其他事件中使用获得随机军方补给。', pending: ['使用次数未定'], use: 'record', tags: ['营救'] }
  ];

  var ITEM_INDEX = {};
  ITEMS.forEach(function (d) { ITEM_INDEX[d.id] = d; });

  function getDef(defId, customItems) {
    if (ITEM_INDEX[defId]) return ITEM_INDEX[defId];
    var list = customItems || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === defId) return list[i];
    return { id: defId, name: defId + '（未知物品）', category: 'custom', capacityTicks: 0, ruleStatus: 'custom',
      effectText: '字典里找不到这个物品：可能是已删除的自定义物品。', unknown: true };
  }

  function allDefs(customItems) {
    return ITEMS.concat(customItems || []);
  }

  /** 按名称或 id 找物品（批量录入用）。 */
  function findDefByName(text, customItems) {
    var key = String(text || '').trim();
    if (!key) return null;
    var defs = allDefs(customItems);
    for (var i = 0; i < defs.length; i++) {
      if (defs[i].id === key || defs[i].name === key) return defs[i];
    }
    var lower = key.toLowerCase();
    for (var j = 0; j < defs.length; j++) if (defs[j].id.toLowerCase() === lower) return defs[j];
    return null;
  }

  function newCustomItem(fields) {
    return {
      id: uid('custom'),
      name: String(fields.name || '').trim() || '未命名物品',
      category: fields.category || 'custom',
      capacityTicks: isInt(fields.capacityTicks) && fields.capacityTicks >= 0 ? fields.capacityTicks : 1,
      effectText: String(fields.effectText || '').trim() || '主持人自定义物品，效果见备注。',
      ruleStatus: 'custom',
      pending: [],
      tags: ['自定义']
    };
  }

  // ---------------------------------------------------------------- 状态、职业、任务

  /* injury: true 表示属于伤病类，医疗箱可清除；null 表示是否属于伤病类未被确认。 */
  var STATUSES = [

  ];

  var TASKS = [

  /* 只作展示，不能被选中生效：「不能让已淘汰版本悄悄生效」。 */

  function getProfession(id) {

  function getTask(id) {

  // ---------------------------------------------------------------- 规则配置

  function defaultRules() {

  /* 设置页的表单描述。status 对应说明里的阅读约定。 */
  var RULE_FIELDS = [
